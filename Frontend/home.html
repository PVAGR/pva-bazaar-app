<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="pvabazaar.org — A personal journal and archive of words.">
  <title>pvabazaar.org</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: Georgia, 'Times New Roman', serif;
      background: #e8eef2;
      color: #1a1a1a;
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .landing {
      text-align: center;
      padding: 48px 24px;
      max-width: 480px;
    }

    h1 {
      font-size: 32px;
      font-weight: normal;
      letter-spacing: -0.5px;
      margin-bottom: 16px;
    }

    p {
      color: #666;
      font-size: 18px;
      font-style: italic;
      margin-bottom: 48px;
    }

    a.enter {
      display: inline-block;
      color: #1a1a1a;
      text-decoration: none;
      font-size: 16px;
      padding: 14px 40px;
      border: 1px solid #1a1a1a;
      transition: all 0.2s;
    }

    a.enter:hover {
      background: #1a1a1a;
      color: #fafafa;
    }

    footer {
      position: fixed;
      bottom: 24px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 13px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="landing">
    <h1>pvabazaar.org</h1>
    <p>A life in words</p>
    <a href="journal.html" class="enter">Enter Journal</a>
  </div>
  <footer>Personal journal and archive</footer>
</body>
</html>
