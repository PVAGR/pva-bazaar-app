<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>System Status - PVA Bazaar</title>
  <link rel="stylesheet" href="../src/lib/openclaw-widget.css" />
  <style>
    :root {
      --bg-main: #f8f9fa;
      --text-main: #1a1a1a;
      --card-bg: #ffffff;
      --border-color: #e0e0e0;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-main: #1a1a1a;
        --text-main: #f8f9fa;
        --card-bg: #2a2a2a;
        --border-color: #404040;
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      line-height: 1.6;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 3rem;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-size: 1.125rem;
      opacity: 0.7;
    }

    .status-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
      margin-bottom: 3rem;
    }

    .status-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .status-card h2 {
      font-size: 1.25rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .status-indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }

    .status-indicator.healthy {
      background: #10b981;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.4);
    }

    .status-indicator.degraded {
      background: #f59e0b;
      box-shadow: 0 0 8px rgba(245, 158, 11, 0.4);
    }

    .status-indicator.error {
      background: #ef4444;
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.4);
    }

    .status-indicator.unknown {
      background: #6b7280;
    }

    .metric-row {
      display: flex;
      justify-content: space-between;
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--border-color);
    }

    .metric-row:last-child {
      border-bottom: none;
    }

    .metric-label {
      opacity: 0.7;
    }

    .metric-value {
      font-weight: 600;
    }

    footer {
      text-align: center;
      margin-top: 4rem;
      padding-top: 2rem;
      border-top: 1px solid var(--border-color);
      opacity: 0.6;
    }

    .openclaw-widget {
      margin: 0 auto;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 2rem;
      }

      .status-grid {
        grid-template-columns: 1fr;
      }
    }

    .loading {
      text-align: center;
      padding: 3rem;
      opacity: 0.7;
    }

    .error-message {
      background: #fee;
      border: 1px solid #fcc;
      color: #c33;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 2rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>System Status</h1>
      <p class="subtitle">Live monitoring for PVA Bazaar services</p>
    </header>

    <!-- OpenClaw Health Widget -->
    <div
      id="openclaw-health-widget"
      class="openclaw-widget-container"
      data-auto-init="true"
      data-refresh-interval="30000"
    ></div>

    <!-- Additional Status Cards -->
    <div class="status-grid">
      <!-- API Status -->
      <div class="status-card">
        <h2>
          <span class="status-indicator" id="api-indicator"></span>
          API Services
        </h2>
        <div id="api-metrics" class="loading">Loading...</div>
      </div>

      <!-- Database Status -->
      <div class="status-card">
        <h2>
          <span class="status-indicator" id="db-indicator"></span>
          Database
        </h2>
        <div id="db-metrics" class="loading">Loading...</div>
      </div>

      <!-- Recent Activity -->
      <div class="status-card">
        <h2>Recent Events</h2>
        <div id="recent-events" class="loading">Loading...</div>
      </div>
    </div>

    <footer>
      <p>Updated every 30 seconds • <a href="/">Return to PVA Bazaar</a></p>
    </footer>
  </div>

  <script src="../src/lib/openclaw-widget.js"></script>
  <script>
    function normalizeBackendBase(raw) {
      const fallback = 'https://api.pvabazaar.org';
      if (!raw || typeof raw !== 'string') return fallback;
      const trimmed = raw.trim().replace(/\/+$/, '');
      if (!trimmed) return fallback;
      return trimmed.endsWith('/api') ? trimmed.slice(0, -4) : trimmed;
    }

    const queryBackend = new URLSearchParams(window.location.search).get('backend');
    const storedBackend = (() => {
      try {
        return localStorage.getItem('backendUrl');
      } catch {
        return null;
      }
    })();
    const BACKEND_BASE = normalizeBackendBase(queryBackend || storedBackend);
    const API_BASE = `${BACKEND_BASE}/api`;

    const widget = document.getElementById('openclaw-health-widget');
    if (widget) {
      widget.dataset.apiUrl = BACKEND_BASE;
    }

    // Fetch and display additional status information
    async function fetchStatus() {
      try {
        const response = await fetch(`${API_BASE}/health`);
        const data = await response.json();

        // Update API Status
        const apiIndicator = document.getElementById('api-indicator');
        const apiMetrics = document.getElementById('api-metrics');
        
        if (data.ok) {
          apiIndicator.className = 'status-indicator healthy';
          apiMetrics.innerHTML = `
            <div class="metric-row">
              <span class="metric-label">Status</span>
              <span class="metric-value">Operational</span>
            </div>
            <div class="metric-row">
              <span class="metric-label">Uptime</span>
              <span class="metric-value">${formatUptime(data.uptime)}</span>
            </div>
            <div class="metric-row">
              <span class="metric-label">Environment</span>
              <span class="metric-value">${data.environment || 'N/A'}</span>
            </div>
          `;
        } else {
          apiIndicator.className = 'status-indicator error';
          apiMetrics.innerHTML = '<div class="error-message">API is unavailable</div>';
        }

        // Update Database Status
        const dbIndicator = document.getElementById('db-indicator');
        const dbMetrics = document.getElementById('db-metrics');
        
        if (data.database === 'connected') {
          dbIndicator.className = 'status-indicator healthy';
          dbMetrics.innerHTML = `
            <div class="metric-row">
              <span class="metric-label">Status</span>
              <span class="metric-value">Connected</span>
            </div>
            <div class="metric-row">
              <span class="metric-label">Type</span>
              <span class="metric-value">MongoDB</span>
            </div>
          `;
        } else {
          dbIndicator.className = 'status-indicator error';
          dbMetrics.innerHTML = '<div class="error-message">Database connection issue</div>';
        }

        // Fetch recent events
        await fetchRecentEvents();

      } catch (error) {
        console.error('Failed to fetch status:', error);
        document.getElementById('api-indicator').className = 'status-indicator error';
        document.getElementById('api-metrics').innerHTML = '<div class="error-message">Failed to fetch status</div>';
      }
    }

    async function fetchRecentEvents() {
      try {
        const response = await fetch(`${API_BASE}/openclaw/recent-events?limit=5`);
        const data = await response.json();
        
        const eventsContainer = document.getElementById('recent-events');
        
        if (data.ok && data.events && data.events.length > 0) {
          eventsContainer.innerHTML = data.events.map(event => `
            <div class="metric-row">
              <span class="metric-label">${event.type}</span>
              <span class="metric-value" style="font-size: 0.875rem;">${formatTime(event.timestamp)}</span>
            </div>
          `).join('');
        } else {
          eventsContainer.innerHTML = '<div style="opacity: 0.6; padding: 1rem;">No recent events</div>';
        }
      } catch (error) {
        console.error('Failed to fetch events:', error);
      }
    }

    function formatUptime(seconds) {
      if (!seconds) return 'N/A';
      const hours = Math.floor(seconds / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);
      if (hours > 24) {
        const days = Math.floor(hours / 24);
        return `${days}d ${hours % 24}h`;
      }
      return `${hours}h ${minutes}m`;
    }

    function formatTime(timestamp) {
      if (!timestamp) return 'N/A';
      const date = new Date(timestamp);
      const now = new Date();
      const diff = Math.floor((now - date) / 1000);
      
      if (diff < 60) return `${diff}s ago`;
      if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
      if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
      return date.toLocaleDateString();
    }

    // Initial fetch
    fetchStatus();

    // Auto-refresh every 30 seconds
    setInterval(fetchStatus, 30000);
  </script>
</body>
</html>
