<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PVA Bazaar - Premium Marketplace</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Reuse your existing CSS variables and base styles */
        :root {
            --primary-dark: #0a1f19;
            --primary: #14372b;
            --primary-light: #1c5a45;
            --accent: #4ef8a3;
            --accent-dark: #2bb673;
            --gold: #d4af37;
            --gold-light: #e6c875;
            --text-light: #e8f4f0;
            --text-muted: #a8b0b9;
            --card-bg: rgba(18, 26, 24, 0.97);
            --card-border: rgba(42, 75, 42, 0.6);
            --red: #f85e5e;
            --green: #4ef8a3;
            --blue: #5e9af8;
            --purple: #a78efa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #0a0a0a;
            color: var(--text-light);
            min-height: 100vh;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header - Reuse your dashboard header styles */
        header {
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--primary);
            padding: 15px 0;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
        }

        .logo-text {
            font-size: 28px;
            font-weight: 800;
            color: var(--text-light);
            font-family: 'Playfair Display', serif;
            background: linear-gradient(to right, var(--accent), var(--gold));
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        nav {
            display: flex;
            gap: 30px;
        }

        nav a {
            color: var(--text-light);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
            padding: 8px 0;
        }

        nav a:hover, nav a.active {
            color: var(--accent);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 24px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(90deg, var(--accent), var(--accent-dark));
            color: var(--primary-dark);
        }

        /* Marketplace Specific Styles */
        .marketplace-hero {
            text-align: center;
            padding: 60px 0 40px;
        }

        .marketplace-title {
            font-size: 3.5rem;
            background: linear-gradient(45deg, var(--accent), var(--gold));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            font-family: 'Playfair Display', serif;
        }

        .marketplace-subtitle {
            color: var(--text-muted);
            font-size: 1.2rem;
            max-width: 600px;
            margin: 0 auto 40px;
            line-height: 1.6;
        }

        /* Filters Section */
        .filters-section {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .filters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .filter-label {
            color: var(--text-light);
            font-weight: 600;
            font-size: 0.9rem;
        }

        .filter-select, .filter-input {
            padding: 12px 15px;
            border-radius: 10px;
            background: rgba(42, 75, 42, 0.3);
            color: var(--text-light);
            border: 1px solid var(--primary-light);
            outline: none;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .search-input {
            flex: 1;
            padding: 12px 20px;
            border-radius: 50px;
            background: rgba(42, 75, 42, 0.3);
            color: var(--text-light);
            border: 1px solid var(--primary-light);
            outline: none;
        }

        /* Items Grid */
        .items-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .items-count {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .sort-options {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }

        .marketplace-item-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s ease;
            position: relative;
        }

        .marketplace-item-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border-color: var(--accent);
        }

        .item-image-container {
            height: 250px;
            overflow: hidden;
            position: relative;
        }

        .item-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .marketplace-item-card:hover .item-image {
            transform: scale(1.05);
        }

        .item-badges {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .item-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            backdrop-filter: blur(10px);
        }

        .badge-trending {
            background: rgba(212, 175, 55, 0.9);
            color: #000;
        }

        .badge-new {
            background: rgba(78, 248, 163, 0.9);
            color: var(--primary-dark);
        }

        .badge-limited {
            background: rgba(248, 94, 94, 0.9);
            color: white;
        }

        .item-actions {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .marketplace-item-card:hover .item-actions {
            opacity: 1;
        }

        .action-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(18, 26, 24, 0.9);
            border: 1px solid var(--primary-light);
            color: var(--text-light);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .action-btn:hover {
            background: var(--accent);
            color: var(--primary-dark);
            border-color: var(--accent);
        }

        .item-details {
            padding: 20px;
        }

        .item-collection {
            color: var(--accent);
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .item-name {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--text-light);
        }

        .item-description {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .item-price-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .item-price {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--gold);
        }

        .item-shares {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .item-progress {
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-dark), var(--accent));
            border-radius: 4px;
        }

        .item-stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .item-consignment {
            background: rgba(42, 75, 42, 0.3);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            margin-bottom: 15px;
        }

        .consignment-title {
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--text-light);
        }

        .consignment-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            color: var(--text-muted);
        }

        .buy-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, var(--accent), var(--accent-dark));
            color: var(--primary-dark);
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .buy-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(78, 248, 163, 0.4);
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 40px 0;
        }

        .pagination-btn {
            padding: 10px 18px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-light);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .pagination-btn.active, .pagination-btn:hover {
            background: var(--accent);
            color: var(--primary-dark);
            border-color: var(--accent);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .marketplace-title {
                font-size: 2.5rem;
            }
            
            .filters-grid {
                grid-template-columns: 1fr;
            }
            
            .items-grid {
                grid-template-columns: 1fr;
            }
            
            .header-content {
                flex-direction: column;
                gap: 15px;
            }
            
            nav {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <a href="/" class="logo">
                    <i class="fas fa-gem logo-icon"></i>
                    <div class="logo-text">PVA Bazaar</div>
                </a>
                <nav>
                    <a href="/">Home</a>
                    <a href="/pages/pvadashboard.html">Dashboard</a>
                    <a href="/pages/productshowcase.html" class="active">Marketplace</a>
                    <a href="/pages/portfolio.html">Portfolio</a>
                </nav>
                <div class="header-actions">
                    <button class="btn btn-primary" id="connectWallet">
                        <i class="fas fa-wallet"></i>
                        Connect Wallet
                    </button>
                </div>
            </div>
        </header>

        <section class="marketplace-hero">
            <h1 class="marketplace-title">Premium Artifact Marketplace</h1>
            <p class="marketplace-subtitle">Discover exclusive physical items with digital ownership. Invest in shares, trade collectibles, and join the future of asset ownership.</p>
        </section>

        <section class="filters-section">
            <div class="filters-grid">
                <div class="filter-group">
                    <label class="filter-label">Category</label>
                    <select class="filter-select" id="categoryFilter">
                        <option value="all">All Categories</option>
                        <option value="jewelry">Jewelry</option>
                        <option value="art">Art & Collectibles</option>
                        <option value="watches">Luxury Watches</option>
                        <option value="antiques">Antiques</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label class="filter-label">Price Range</label>
                    <select class="filter-select" id="priceFilter">
                        <option value="all">Any Price</option>
                        <option value="0-100">Under $100</option>
                        <option value="100-500">$100 - $500</option>
                        <option value="500-1000">$500 - $1,000</option>
                        <option value="1000+">Over $1,000</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label class="filter-label">Share Availability</label>
                    <select class="filter-select" id="sharesFilter">
                        <option value="all">Any Availability</option>
                        <option value="high">High Availability</option>
                        <option value="medium">Medium Availability</option>
                        <option value="low">Low Availability</option>
                        <option value="sold-out">Almost Sold Out</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label class="filter-label">Sort By</label>
                    <select class="filter-select" id="sortFilter">
                        <option value="newest">Newest First</option>
                        <option value="trending">Trending</option>
                        <option value="price-low">Price: Low to High</option>
                        <option value="price-high">Price: High to Low</option>
                        <option value="shares">Share Availability</option>
                    </select>
                </div>
            </div>
            
            <div class="search-box">
                <input type="text" class="search-input" id="searchInput" placeholder="Search items, collections, or artifacts...">
                <button class="btn btn-primary">
                    <i class="fas fa-search"></i>
                    Search
                </button>
            </div>
        </section>

        <section class="items-section">
            <div class="items-header">
                <h2 class="section-title">Featured Artifacts</h2>
                <div class="items-count" id="itemsCount">Loading items...</div>
                <div class="sort-options">
                    <span>View:</span>
                    <button class="view-btn active" data-view="grid"><i class="fas fa-th"></i></button>
                    <button class="view-btn" data-view="list"><i class="fas fa-list"></i></button>
                </div>
            </div>

            <div class="items-grid" id="itemsGrid">
                <!-- Items will be loaded here by JavaScript -->
            </div>

            <div class="pagination" id="pagination">
                <!-- Pagination will be generated by JavaScript -->
            </div>
        </section>
    </div>

    <script>
        // API Helper (same as dashboard)
        async function fetchAPI(endpoint) {
            try {
                const res = await fetch(endpoint);
                if (!res.ok) throw new Error('API error');
                return await res.json();
            } catch (e) {
                console.error('API fetch failed:', endpoint, e);
                return null;
            }
        }

        // Wallet Connect Logic (same as dashboard)
        function getConnectedWallet() {
            return window.localStorage.getItem('walletAddress') || '';
        }

        function setConnectedWallet(addr) {
            window.localStorage.setItem('walletAddress', addr);
        }

        function updateWalletButton() {
            const walletBtn = document.getElementById('connectWallet');
            const wallet = getConnectedWallet();
            if (wallet) {
                walletBtn.innerHTML = `<i class="fas fa-wallet"></i> Wallet: ${wallet.slice(0,6)}...${wallet.slice(-4)}`;
            } else {
                walletBtn.innerHTML = `<i class="fas fa-wallet"></i> Connect Wallet`;
            }
        }

        function connectWallet() {
            const wallet = getConnectedWallet();
            if (wallet) {
                if (confirm('Disconnect wallet ' + wallet + '?')) {
                    setConnectedWallet('');
                    updateWalletButton();
                }
            } else {
                const fakeWallet = prompt('Enter wallet address to connect:');
                if (fakeWallet) {
                    setConnectedWallet(fakeWallet);
                    updateWalletButton();
                }
            }
        }

        // Marketplace Data and Rendering
        let currentItems = [];
        let currentPage = 1;
        const itemsPerPage = 9;

        async function loadMarketplaceItems() {
            const itemsRes = await fetchAPI('/api/artifacts?limit=100');
            const itemsGrid = document.getElementById('itemsGrid');
            const itemsCount = document.getElementById('itemsCount');
            
            itemsGrid.innerHTML = '<div class="loading">Loading premium artifacts...</div>';
            
            if (itemsRes && itemsRes.ok && itemsRes.artifacts) {
                currentItems = itemsRes.artifacts;
                displayItems(currentItems);
                updateItemsCount(currentItems.length);
                setupPagination(currentItems.length);
            } else {
                // Fallback demo data
                currentItems = generateDemoItems();
                displayItems(currentItems);
                updateItemsCount(currentItems.length);
                setupPagination(currentItems.length);
            }
        }

        function generateDemoItems() {
            return [
                {
                    id: 1,
                    name: "Amradjet Emerald Pendant",
                    collection: "Genesis Collection",
                    description: "Exquisite emerald pendant with diamond accents, certified natural stones.",
                    price: 2500,
                    image: "https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=600&q=80",
                    shares: { sold: 845, total: 1000 },
                    consignment: { artisan: 70, pva: 15, promoter: 15 },
                    badges: ["trending", "new"]
                },
                {
                    id: 2,
                    name: "Sapphire Wave Bracelet",
                    collection: "Ocean Series",
                    description: "Handcrafted bracelet featuring natural sapphires in wave-inspired design.",
                    price: 1800,
                    image: "https://images.unsplash.com/photo-1602173574767-37ac01994b2a?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=600&q=80",
                    shares: { sold: 420, total: 500 },
                    consignment: { artisan: 65, pva: 20, promoter: 15 },
                    badges: ["limited"]
                },
                {
                    id: 3,
                    name: "Ruby Dragon Pendant",
                    collection: "Mythical Collection",
                    description: "Dragon-inspired pendant with rare ruby and gold craftsmanship.",
                    price: 3500,
                    image: "https://images.unsplash.com/photo-1599643478510-a349f0d8a0e8?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=600&q=80",
                    shares: { sold: 300, total: 400 },
                    consignment: { artisan: 75, pva: 15, promoter: 10 },
                    badges: ["trending"]
                }
            ];
        }

        function displayItems(items) {
            const itemsGrid = document.getElementById('itemsGrid');
            const startIndex = (currentPage - 1) * itemsPerPage;
            const paginatedItems = items.slice(startIndex, startIndex + itemsPerPage);
            
            itemsGrid.innerHTML = paginatedItems.map(item => `
                <div class="marketplace-item-card" data-item-id="${item.id}">
                    <div class="item-image-container">
                        <img src="${item.image}" alt="${item.name}" class="item-image">
                        <div class="item-badges">
                            ${item.badges.map(badge => `
                                <div class="item-badge badge-${badge}">
                                    ${badge === 'trending' ? 'Trending' : badge === 'new' ? 'New' : 'Limited'}
                                </div>
                            `).join('')}
                        </div>
                        <div class="item-actions">
                            <button class="action-btn" title="Add to favorites">
                                <i class="far fa-heart"></i>
                            </button>
                            <button class="action-btn" title="Quick view">
                                <i class="far fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="item-details">
                        <div class="item-collection">${item.collection}</div>
                        <h3 class="item-name">${item.name}</h3>
                        <p class="item-description">${item.description}</p>
                        
                        <div class="item-price-section">
                            <div class="item-price">$${item.price.toLocaleString()}</div>
                            <div class="item-shares">${item.shares.sold}/${item.shares.total} shares</div>
                        </div>
                        
                        <div class="item-progress">
                            <div class="progress-bar" style="width: ${(item.shares.sold / item.shares.total) * 100}%"></div>
                        </div>
                        
                        <div class="item-stats">
                            <div>${Math.round((item.shares.sold / item.shares.total) * 100)}% funded</div>
                            <div>$${(item.price / item.shares.total).toFixed(2)}/share</div>
                        </div>
                        
                        <div class="item-consignment">
                            <div class="consignment-title">Revenue Share</div>
                            <div class="consignment-details">
                                <span>Artisan: ${item.consignment.artisan}%</span>
                                <span>PVA: ${item.consignment.pva}%</span>
                                <span>Promoter: ${item.consignment.promoter}%</span>
                            </div>
                        </div>
                        
                        <button class="buy-btn" onclick="openPurchaseModal(${item.id})">
                            <i class="fas fa-shopping-cart"></i>
                            Buy Shares
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function updateItemsCount(count) {
            document.getElementById('itemsCount').textContent = `${count} items found`;
        }

        function setupPagination(totalItems) {
            const totalPages = Math.ceil(totalItems / itemsPerPage);
            const pagination = document.getElementById('pagination');
            
            let paginationHTML = '';
            
            if (currentPage > 1) {
                paginationHTML += `<button class="pagination-btn" onclick="changePage(${currentPage - 1})">Previous</button>`;
            }
            
            for (let i = 1; i <= totalPages; i++) {
                paginationHTML += `
                    <button class="pagination-btn ${i === currentPage ? 'active' : ''}" 
                            onclick="changePage(${i})">${i}</button>
                `;
            }
            
            if (currentPage < totalPages) {
                paginationHTML += `<button class="pagination-btn" onclick="changePage(${currentPage + 1})">Next</button>`;
            }
            
            pagination.innerHTML = paginationHTML;
        }

        function changePage(page) {
            currentPage = page;
            displayItems(currentItems);
            setupPagination(currentItems.length);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function openPurchaseModal(itemId) {
            const item = currentItems.find(i => i.id === itemId);
            if (item) {
                alert(`Purchase modal for: ${item.name}\nPrice: $${item.price}\nAvailable shares: ${item.shares.total - item.shares.sold}`);
                // You would implement a proper modal here
            }
        }

        // Initialize marketplace
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize wallet
            const walletBtn = document.getElementById('connectWallet');
            if (walletBtn) {
                walletBtn.onclick = connectWallet;
                updateWalletButton();
            }
            
            // Load items
            loadMarketplaceItems();
            
            // Setup filter handlers
            document.getElementById('categoryFilter').addEventListener('change', applyFilters);
            document.getElementById('priceFilter').addEventListener('change', applyFilters);
            document.getElementById('sharesFilter').addEventListener('change', applyFilters);
