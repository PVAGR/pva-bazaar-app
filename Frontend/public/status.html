<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PVA Bazaar live status page." />
    <title>PVA Bazaar Status</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b1118;
        color: #e8edf3;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        padding: 24px;
      }
      .card {
        width: min(760px, 100%);
        background: #111922;
        border: 1px solid #223544;
        border-radius: 18px;
        padding: 24px;
        box-shadow: 0 20px 90px rgba(0, 0, 0, 0.3);
      }
      h1 { margin: 0 0 8px; font-size: clamp(1.7rem, 3vw, 2.5rem); }
      p { margin: 0; color: #a9b6c4; line-height: 1.6; }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin-top: 18px;
      }
      .row {
        border: 1px solid #223544;
        border-radius: 14px;
        padding: 14px;
        background: rgba(255, 255, 255, 0.02);
      }
      .label {
        display: block;
        color: #6fe7c8;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 6px;
      }
      .status {
        font-size: 0.98rem;
        color: #e8edf3;
      }
      code {
        display: inline-block;
        margin-top: 8px;
        background: rgba(255,255,255,0.06);
        border-radius: 8px;
        padding: 3px 8px;
        word-break: break-all;
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 18px;
      }
      a {
        color: #9af0dd;
        text-decoration: none;
        border: 1px solid #223544;
        border-radius: 999px;
        padding: 8px 12px;
        background: rgba(255,255,255,0.03);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>PVA Bazaar Status</h1>
      <p>This page checks the current backend URL and the live health endpoint configured for this site.</p>

      <div class="grid">
        <div class="row">
          <span class="label">Backend URL</span>
          <div class="status" id="backendUrl">Loading...</div>
        </div>
        <div class="row">
          <span class="label">Health check</span>
          <div class="status" id="healthStatus">Loading...</div>
        </div>
      </div>

      <div class="row" style="margin-top: 12px;">
        <span class="label">Response</span>
        <div class="status" id="healthDetail">Waiting for fetch...</div>
      </div>

      <div class="links">
        <a href="/">Home</a>
        <a href="/llms.txt">llms.txt</a>
        <a href="/readable-site.json">readable-site.json</a>
        <a href="/sitemap.xml">sitemap.xml</a>
      </div>
    </main>

    <script>
      async function loadStatus() {
        const backendUrlNode = document.getElementById('backendUrl');
        const healthStatusNode = document.getElementById('healthStatus');
        const healthDetailNode = document.getElementById('healthDetail');

        try {
          const res = await fetch('/api-base.json', { cache: 'no-store' });
          const cfg = await res.json();
          const apiBase = String(cfg.apiUrl || '').replace(/\/+$/, '');
          backendUrlNode.textContent = apiBase || 'Not configured';

          if (!apiBase) {
            healthStatusNode.textContent = 'No backend configured';
            healthDetailNode.textContent = 'Set api-base.json or the deployment env to point at the live API.';
            return;
          }

          const healthUrl = apiBase.endsWith('/api') ? `${apiBase}/health` : `${apiBase}/api/health`;
          const healthRes = await fetch(healthUrl, { headers: { Accept: 'application/json' } });
          const text = await healthRes.text();
          let body = text;
          try {
            const parsed = JSON.parse(text);
            body = JSON.stringify(parsed, null, 2);
          } catch {}

          healthStatusNode.textContent = healthRes.ok ? 'OK' : `Unavailable (${healthRes.status})`;
          healthDetailNode.innerHTML = `<code>${body.slice(0, 500)}</code>`;
        } catch (error) {
          backendUrlNode.textContent = 'Unknown';
          healthStatusNode.textContent = 'Error';
          healthDetailNode.textContent = String(error).slice(0, 240);
        }
      }

      loadStatus();
    </script>
  </body>
</html>
