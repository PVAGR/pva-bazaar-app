<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | PVA Bazaar</title>
  <meta name="description" content="The requested PVA Bazaar page could not be found." />
  <link rel="canonical" href="https://pvabazaar.org/404.html" />
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="/styles/static-pages.css" />
</head>
<body>
  <div class="shell">
    <main class="page">
      <section class="hero">
        <span class="eyebrow">404</span>
        <h1>This page could not be found.</h1>
        <p id="redirectMessage">The link may be old, renamed, or missing. Use the navigation below to continue.</p>
        <div class="actions">
          <a class="button" href="/">Home</a>
          <a class="button secondary" href="/marketplace.html">Marketplace</a>
          <a class="button secondary" href="/archive.html">Archive</a>
          <a class="button secondary" href="/contact.html">Contact</a>
          <a class="button secondary" href="/about.html">About</a>
        </div>
      </section>
    </main>
  </div>
  <script>
    (function () {
      const path = (globalThis.location?.pathname || '/').replace(/\/+$/, '') || '/';
      const normalized = path.toLowerCase();
      const redirects = {
        '/welcome': '/',
        '/pages/welcome.html': '/',
        '/home': '/',
        '/about': '/about.html',
        '/about.html': '/about.html',
        '/marketplace': '/marketplace.html',
        '/marketplace.html': '/marketplace.html',
        '/archive': '/archive.html',
        '/archive.html': '/archive.html',
        '/writings': '/writings.html',
        '/writings.html': '/writings.html',
        '/books': '/books.html',
        '/books.html': '/books.html',
        '/books/published': '/#/books/published',
        '/creator': '/creator.html',
        '/creator.html': '/creator.html',
        '/partnerships': '/partnerships.html',
        '/partnerships.html': '/partnerships.html',
        '/provenance': '/provenance.html',
        '/provenance.html': '/provenance.html',
        '/contact': '/contact.html',
        '/contact.html': '/contact.html',
        '/recovery': '/recovery.html',
        '/recovery.html': '/recovery.html',
        '/portfolio': '/portfolio.html',
        '/portfolio.html': '/portfolio.html',
        '/pvashares.html': '/pvashares.html',
        '/governance': '/governance.html',
        '/proposals': '/governance.html',
        '/conference': '/governance.html',
        '/forum': '/forum.html',
        '/heelkawn': '/heelkawn.html',
        '/status': '/status.html',
        '/status.html': '/status.html',
        '/privacy': '/privacy.html',
        '/privacy.html': '/privacy.html',
        '/terms': '/terms.html',
        '/terms.html': '/terms.html',
        '/shipping': '/shipping.html',
        '/shipping.html': '/shipping.html',
        '/returns': '/returns.html',
        '/returns.html': '/returns.html',
        '/disclaimer': '/disclaimer.html',
        '/disclaimer.html': '/disclaimer.html',
      };
      const target = redirects[normalized];
      if (target && target !== globalThis.location?.pathname) {
        const message = document.getElementById('redirectMessage');
        if (message) {
          message.textContent = `Redirecting to the closest live page for ${path || '/'}.`;
        }
        globalThis.setTimeout(() => {
          globalThis.location.replace(target);
        }, 40);
      }
    })();
  </script>
</body>
</html>
