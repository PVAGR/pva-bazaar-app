<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0e27" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="canonical" href="https://pvabazaar.org/" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="description" content="PVA Bazaar is a personal archive and business suite for writings, commerce, recovery, civic tools, provenance, and HeelKawn." />
    <meta name="llm:readable" content="true" />
    <meta name="llm:content-url" content="https://pvabazaar.org/llms.txt" />
    <meta name="llm:snapshot-url" content="https://pvabazaar.org/readable-site.json" />
    <!-- Federation Protocol Metadata -->
    <meta name="pva:federation-enabled" content="%VITE_FEDERATION_ENABLED%" />
    <meta name="pva:community-id" content="%VITE_COMMUNITY_ID%" />
    <meta name="pva:federation-hub" content="%VITE_FEDERATION_HUB_URL%" />
    <meta name="pva:federation-community-url-template" content="https://federation.pvabazaar.org/api/communities/%VITE_COMMUNITY_ID%" />
    <!-- Pages deploy: bump when forcing rebuild after API URL changes -->
    <title>PVA Bazaar — Personal Site, Business, and Writings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Open+Sans:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      body {
        margin: 0;
        font-family: 'Open Sans', Arial, sans-serif;
        background: linear-gradient(135deg, #0a0e27 0%, #111a3a 100%);
        color: #e0f2f1;
      }

      #app-shell-fallback {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .fallback-panel {
        width: min(620px, 100%);
        background: rgba(15, 15, 30, 0.9);
        border: 1px solid #00695c;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }

      .fallback-title {
        margin: 0 0 10px;
        color: #26c6da;
        font-family: 'Merriweather', serif;
        font-size: 1.35rem;
      }

      .fallback-copy {
        margin: 0;
        color: #b2dfdb;
        line-height: 1.5;
      }

      body[data-app-mounted='true'] #app-shell-fallback {
        display: none;
      }

      noscript .noscript-panel {
        max-width: 760px;
        margin: 40px auto;
        border: 1px solid #00695c;
        border-radius: 12px;
        padding: 18px 20px;
        background: rgba(15, 15, 30, 0.9);
      }

      noscript h1 {
        margin: 0 0 8px;
        color: #26c6da;
        font-family: 'Merriweather', serif;
      }

      noscript p,
      noscript li,
      noscript a {
        color: #e0f2f1;
      }
    </style>
    <script>
      window.setTimeout(function () {
        var root = document.getElementById('root');
        var mounted = document.body && document.body.dataset && document.body.dataset.appMounted === 'true';
        if (!mounted && (!root || root.childElementCount === 0)) {
          var fallback = document.getElementById('app-shell-fallback');
          if (fallback) fallback.hidden = false;
        }
      }, 3500);
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "PVA Bazaar",
        "url": "https://pvabazaar.org/",
        "description": "PVA Bazaar personal archive, business bridge, recovery layer, civic tools, and HeelKawn hub.",
        "hasPart": [
          {
            "@type": "WebPage",
            "name": "Marketplace",
            "url": "https://pvabazaar.org/#/marketplace"
          },
          {
            "@type": "WebPage",
            "name": "Showroom",
            "url": "https://pvabazaar.org/#/showroom"
          },
          {
            "@type": "WebPage",
            "name": "Supplier Portal",
            "url": "https://pvabazaar.org/#/creator"
          },
          {
            "@type": "WebPage",
            "name": "Archive Library",
            "url": "https://pvabazaar.org/#/archive"
          },
          {
            "@type": "WebPage",
            "name": "About",
            "url": "https://pvabazaar.org/#/about"
          },
          {
            "@type": "WebPage",
            "name": "Download App",
            "url": "https://pvabazaar.org/#/download-app"
          },
          {
            "@type": "WebPage",
            "name": "Recovery",
            "url": "https://pvabazaar.org/#/recovery"
          },
          {
            "@type": "WebPage",
            "name": "HeelKawn",
            "url": "https://pvabazaar.org/#/heelkawn"
          }
        ]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "PVA Bazaar",
        "url": "https://pvabazaar.org/",
        "description": "A sourcing bridge connecting global suppliers, artisans, and makers with American buyers through provenance, presentation, and archive context.",
        "areaServed": ["United States", "Global"],
        "knowsAbout": ["global sourcing", "artisan supply chains", "product provenance", "archive publishing"]
      }
    </script>
  </head>
  <body>
    <div id="root" role="main"></div>
    <noscript>
      <section class="noscript-panel" aria-label="PVA Bazaar no-script guidance">
        <h1>PVA Bazaar</h1>
        <p>This site requires JavaScript for the full marketplace, archive, and supplier experience.</p>
        <p>Machine-readable resources for crawlers and AI tools:</p>
        <ul>
          <li><a href="/llms.txt">llms.txt</a></li>
          <li><a href="/readable-site.json">readable-site.json</a></li>
          <li><a href="/sitemap.xml">sitemap.xml</a></li>
        </ul>
      </section>
    </noscript>
    <div id="app-shell-fallback" hidden>
      <div class="fallback-panel">
        <h1 class="fallback-title">Loading PVA Bazaar...</h1>
        <p class="fallback-copy">If this takes unusually long, refresh the page once. If the issue persists, check <a href="/status.html">status</a> or read <a href="/llms.txt">llms.txt</a>.</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- api-test.js excluded from production builds -->
  </body>
</html>
