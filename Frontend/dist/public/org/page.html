<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PVA Bazaar — Editable Page</title>
  <link href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css" rel="stylesheet" />
  <link href="/style.css" rel="stylesheet" />
</head>
<body>
  <div class="container">
    <header>
      <div>
        <div class="slug">Editable Page</div>
        <div class="status" id="status">Loading content…</div>
      </div>
      <nav>
        <a href="/blog.html" class="status">Blogs</a>
        · <a href="/contribute.html" class="status">Contribute</a>
        · <a href="/admin.html" class="status">Admin</a>
      </nav>
    </header>

    <div id="content"></div>
    <div id="editor"></div>
    <div class="actions">
      <button id="editBtn" class="secondary" style="display:none">Edit</button>
      <button id="saveBtn" style="display:none">Save</button>
    </div>
    <div class="note">Use URL params: <strong>?slug=home</strong> and optional <strong>&edit=YOUR_SECRET</strong>.</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.min.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const slug = (params.get('slug') || 'home').toLowerCase();
    const editSecret = params.get('edit') || '';

    const statusEl = document.getElementById('status');
    const contentEl = document.getElementById('content');
    const editorEl = document.getElementById('editor');
    const editBtn = document.getElementById('editBtn');
    const saveBtn = document.getElementById('saveBtn');

    const quill = new Quill('#editor', { theme: 'snow' });

    async function loadContent() {
      try {
        statusEl.textContent = `Loading "+slug+"…`;
        const res = await fetch(`/api/pages/${encodeURIComponent(slug)}`);
        const data = await res.json();
        if (!data.ok) throw new Error(data.message || 'Failed to load');
        contentEl.innerHTML = data.content || '<em>No content yet</em>';
        statusEl.textContent = `Viewing: ${slug}`;
        if (editSecret) {
          contentEl.style.display = 'none';
          editorEl.style.display = 'block';
          editBtn.style.display = 'none';
          saveBtn.style.display = 'inline-block';
          quill.root.innerHTML = data.content || '';
          statusEl.textContent = `Editing: ${slug}`;
        } else {
          editBtn.style.display = 'inline-block';
        }
      } catch (e) {
        statusEl.textContent = 'Error loading page';
        contentEl.textContent = e.message;
      }
    }

    editBtn.addEventListener('click', () => {
      alert('Provide ?edit=YOUR_SECRET in the URL to enable editing.');
    });

    saveBtn.addEventListener('click', async () => {
      try {
        const html = quill.root.innerHTML;
        const res = await fetch(`/api/pages/${encodeURIComponent(slug)}/update?edit=${encodeURIComponent(editSecret)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content: html })
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.message || 'Update failed');
        statusEl.textContent = 'Saved successfully';
      } catch (e) {
        alert(e.message);
      }
    });

    loadContent();
  </script>
</body>
</html>
