<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Comments • PVA Bazaar</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto;max-width:720px;margin:40px auto;padding:0 16px;background:#0b0f12;color:#e6eef6}
    a{color:#79c0ff}
    header{margin-bottom:24px}
    label{display:block;margin:12px 0 6px}
    input,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #253040;background:#11161b;color:#e6eef6}
    textarea{min-height:120px}
    button{margin-top:16px;padding:10px 16px;border-radius:8px;border:1px solid #2a3a4a;background:#183247;color:#e6eef6;cursor:pointer}
    ul{list-style:none;padding:0}
    li{border:1px solid #253040;border-radius:8px;padding:10px;margin:8px 0;background:#11161b}
    .msg{margin-top:8px}
  </style>
</head>
<body>
  <header>
    <h1>Comments</h1>
    <p>
      <a href="/public/blogs.html">Blogs</a>
      ·
      <a id="postLink" href="#">View Post</a>
    </p>
  </header>
  <script src="/public/config.js"></script>
  <div id="conn" class="msg" style="margin-top:0.5rem"></div>
  <main>
    <section>
      <h2 id="slugTitle">Loading…</h2>
      <ul id="comments"></ul>
      <div id="status" class="msg"></div>
    </section>
    <section>
      <h3>Add a Comment</h3>
      <form id="commentForm">
        <label for="authorName">Your name</label>
        <input id="authorName" name="authorName" />
        <label for="body">Comment</label>
        <textarea id="body" name="body" required></textarea>
        <button type="submit">Post Comment</button>
      </form>
      <div id="msg" class="msg"></div>
    </section>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const slug = params.get('slug') || 'welcome';
    document.getElementById('slugTitle').textContent = `For: ${slug}`;
    const postLink = document.getElementById('postLink');
    postLink.href = `/public/blog.html?slug=${encodeURIComponent(slug)}`;

    const backend = (window.APP_CONFIG && window.APP_CONFIG.backendUrl) || null;
    const apiBase = backend ? `${backend}/api` : '/api';
    async function checkHealth(){
      const el = document.getElementById('conn');
      if (!backend) { el.textContent = 'Serverless mode'; return; }
      try {
        const r = await fetch(`${backend}/api/health`, { credentials:'omit' });
        el.textContent = r.ok ? 'Backend connected' : 'Backend unreachable';
      } catch { el.textContent = 'Backend unreachable'; }
    }
    checkHealth();
    async function load() {
      document.getElementById('status').textContent = 'Loading comments...';
      try {
        const res = await fetch(`${apiBase}/comments/${encodeURIComponent(slug)}`);
        const data = await res.json();
        const list = document.getElementById('comments');
        list.textContent = '';
        const comments = (data && data.comments) || [];
        if (!comments.length) {
          document.getElementById('status').textContent = 'No comments yet.';
        } else {
          document.getElementById('status').textContent = '';
          for (const c of comments) {
            const li = document.createElement('li');
            const who = c.authorName || 'Anonymous';
            const when = c.createdAt ? new Date(c.createdAt).toLocaleString() : '';
            li.innerHTML = `<strong>${who}</strong><br/>${c.body}<br/><small>${when}</small>`;
            list.appendChild(li);
          }
        }
      } catch (e) {
        document.getElementById('status').textContent = 'Failed to load comments.';
      }
    }

    const form = document.getElementById('commentForm');
    const msg = document.getElementById('msg');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.textContent = 'Posting...';
      try {
        const authorName = document.getElementById('authorName').value.trim();
        const body = document.getElementById('body').value.trim();
        const res = await fetch(`${apiBase}/comments/${encodeURIComponent(slug)}/add`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ authorName, body })
        });
        const data = await res.json();
        if (data && data.ok !== false) {
          msg.textContent = 'Posted!';
          document.getElementById('body').value = '';
          await load();
        } else {
          msg.textContent = 'Post failed.';
        }
      } catch (err) {
        msg.textContent = 'Error: ' + (err && err.message || 'Unknown');
      }
    });

    load();
  </script>
</body>
</html>
