<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PVA Bazaar - Marketplace</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/public/css/pva-nav.css">
  <style>
    :root {
      --primary-dark: #0f3b2d;
      --primary: #1c5a45;
      --primary-light: #2d7d5a;
      --accent: #4ef8a3;
      --accent-dark: #2bb673;
      --gold: #d4af37;
      --text-light: #e8f4f0;
      --text-muted: #a8b0b9;
      --card-bg: rgba(18, 18, 18, 0.95);
      --card-border: rgba(42, 75, 42, 0.6);
      --gradient-start: #4ef8a3;
      --gradient-mid: #2bb673;
      --gradient-end: #1c5a45;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background: #0a0a0a; color: var(--text-light); min-height: 100vh; }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; margin-bottom: 30px; border-bottom: 1px solid var(--primary); }
    .logo { display: flex; align-items: center; gap: 15px; text-decoration: none; }
    .logo-icon { font-size: 2rem; color: var(--accent); }
    .logo-text { font-family: 'Playfair Display', serif; font-size: 1.7rem; font-weight: 700; color: var(--gold); }
    nav ul { display: flex; gap: 18px; list-style: none; }
    nav a { color: var(--text-light); text-decoration: none; font-weight: 500; }
    nav a.active, nav a:hover { color: var(--accent); }
    .header-actions { display: flex; gap: 12px; }
    .icon-btn, .btn { background: none; border: none; color: var(--accent); font-size: 1.1rem; cursor: pointer; padding: 8px 14px; border-radius: 8px; transition: background 0.2s; }
    .icon-btn:hover, .btn:hover { background: var(--primary-light); }
    .marketplace-title { font-size: 2rem; font-weight: 700; color: var(--gold); margin-bottom: 24px; }
    .product-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 28px; margin-bottom: 36px; }
  .product-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; align-items: flex-start; box-shadow: 0 2px 12px rgba(0,0,0,0.08); position: relative; transition: transform 0.15s, box-shadow 0.15s; }
  .product-card:hover { transform: translateY(-4px) scale(1.012); box-shadow: 0 6px 24px rgba(46,255,170,0.10); z-index: 2; }
  .product-badges { display: flex; gap: 7px; margin-bottom: 7px; }
  .badge { display: inline-flex; align-items: center; font-size: 0.85rem; font-weight: 600; border-radius: 6px; padding: 2px 8px; background: var(--primary-light); color: #fff; letter-spacing: 0.01em; }
  .badge.verified { background: var(--accent-dark); color: #fff; }
  .badge.top { background: var(--gold); color: #222; }
  .badge.new { background: #2d7d5a; color: #fff; }
  .product-rating { display: flex; align-items: center; gap: 4px; font-size: 1.01rem; margin-bottom: 8px; color: var(--gold); }
  .product-rating .fa-star { color: var(--gold); font-size: 1.05em; }
  .product-rating .review-count { color: var(--text-muted); font-size: 0.97em; margin-left: 3px; }
    .product-title { font-size: 1.2rem; font-weight: 600; color: var(--accent); margin-bottom: 8px; }
    .product-meta { color: var(--text-muted); font-size: 0.98rem; margin-bottom: 10px; }
    .product-desc { font-size: 1rem; margin-bottom: 14px; color: var(--text-light); }
    .product-actions { display: flex; gap: 10px; margin-top: auto; }
    .buy-btn, .share-btn { background: var(--accent-dark); color: #fff; border: none; border-radius: 6px; padding: 7px 16px; font-size: 1rem; cursor: pointer; transition: background 0.2s; }
    .buy-btn:hover, .share-btn:hover { background: var(--accent); color: #0a0a0a; }
    .ownership-section { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 24px; margin-bottom: 32px; }
    .ownership-title { font-size: 1.3rem; font-weight: 600; color: var(--accent); margin-bottom: 18px; }
    .ownership-table { width: 100%; border-collapse: collapse; margin-bottom: 18px; }
    .ownership-table th, .ownership-table td { padding: 10px 8px; border-bottom: 1px solid var(--card-border); text-align: left; }
    .ownership-table th { color: var(--gold); font-weight: 600; background: var(--primary-dark); }
    .ownership-table tr:last-child td { border-bottom: none; }
    .action-cell { display: flex; gap: 8px; }
    .table-btn { background: var(--accent-dark); color: #fff; border: none; border-radius: 6px; padding: 6px 14px; font-size: 0.98rem; cursor: pointer; transition: background 0.2s; }
    .table-btn:hover { background: var(--accent); color: #0a0a0a; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <a href="/" class="logo">
        <i class="fas fa-gem logo-icon"></i>
        <div class="logo-text">PVA Bazaar</div>
      </a>
      <nav>
        <ul>
          <li><a href="/">Home</a></li>
          <li><a href="/pages/pvadashboard.html">Dashboard</a></li>
          <li><a href="/pages/marketplace.html" class="active">Marketplace</a></li>
          <li><a href="/pages/portfolio.html">Portfolio</a></li>
          <li><a href="/pages/checkoutmint.html">Checkout</a></li>
          <li><a href="/pages/provenance.html">Provenance</a></li>
          <li><a href="/pages/provtrack.html">Provenance Tracker</a></li>
          <li><a href="/pages/assetcreate.html">Asset Creation</a></li>
          <li><a href="/pages/pvacertadmit.html">Certificate Admission</a></li>
          <li><a href="/pages/admin.html">Admin</a></li>
          <li><a href="/pages/pvashares.html">Shares</a></li>
          <li><a href="/pages/welcome.html">Welcome</a></li>
        </ul>
      </nav>
      <div class="header-actions">
        <button class="icon-btn" id="searchToggle" title="Search">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
        <button class="btn" id="connectWallet">
          <i class="fa-solid fa-wallet"></i>
          Connect Wallet
        </button>
      </div>
    </header>
    <div class="marketplace-title">
      <h1>PVA Marketplace</h1>
      <div class="marketplace-filters">
        <select id="categoryFilter">
          <option value="">All Categories</option>
          <option value="jewelry">Jewelry</option>
          <option value="gemstone">Gemstone</option>
          <option value="art">Art</option>
          <option value="textile">Textile</option>
          <option value="collectible">Collectible</option>
          <option value="antique">Antique</option>
        </select>
        <select id="statusFilter">
          <option value="active">Available</option>
          <option value="sold">Sold</option>
          <option value="">All Status</option>
        </select>
        <button id="refreshBtn" class="btn">
          <i class="fas fa-refresh"></i> Refresh
        </button>
      </div>
    </div>
    
    <div id="marketplace-items" class="product-list">
      <!-- Items will be loaded here by JavaScript -->
    </div>
    
    <div class="ownership-section">
      <div class="ownership-title">Shared Ownership Opportunities</div>
      <div id="shared-ownership-items">
        <!-- Shared ownership items will be loaded here -->
      </div>
    </div>
  </div>

  <!-- Include submission system -->
  <script src="/Frontend/src/submissions.js"></script>
  <script>
    // Enhanced marketplace functionality
    document.addEventListener('DOMContentLoaded', async function() {
      // Initialize the display manager
      const api = new SubmissionAPI();
      const displayManager = new DataDisplayManager(api);
      
      // Load marketplace items
      await loadMarketplaceItems();
      
      // Set up filters
      setupFilters();
      
      // Set up refresh button
      document.getElementById('refreshBtn').addEventListener('click', loadMarketplaceItems);
    });

    async function loadMarketplaceItems() {
      const container = document.getElementById('marketplace-items');
      container.innerHTML = '<div class="loading">Loading marketplace items...</div>';
      
      try {
        const api = new SubmissionAPI();
        const categoryFilter = document.getElementById('categoryFilter').value;
        const statusFilter = document.getElementById('statusFilter').value;
        
        const filters = {};
        if (categoryFilter) filters.category = categoryFilter;
        if (statusFilter) filters.status = statusFilter;
        
        const result = await api.getSubmissions('marketplace', filters);
        
        if (result.ok && result.data.length > 0) {
          container.innerHTML = renderMarketplaceItems(result.data);
          setupItemInteractions();
        } else {
          container.innerHTML = `
            <div class="empty-state">
              <i class="fas fa-shopping-bag" style="font-size: 3rem; color: var(--text-muted); margin-bottom: 1rem;"></i>
              <h3>No items available</h3>
              <p>Check back later or <a href="/pages/assetcreate.html">submit your own asset</a>!</p>
            </div>
          `;
        }
        
      } catch (error) {
        console.error('Error loading marketplace items:', error);
        container.innerHTML = `
          <div class="error-state">
            <i class="fas fa-exclamation-triangle" style="font-size: 3rem; color: #e74c3c; margin-bottom: 1rem;"></i>
            <h3>Error loading items</h3>
            <p>Please try again later or contact support.</p>
            <button onclick="loadMarketplaceItems()" class="btn">Try Again</button>
          </div>
        `;
      }
    }

    function renderMarketplaceItems(items) {
      return items.map(item => `
        <div class="product-card" data-id="${item.id}">
          <div class="product-image">
            ${item.images && item.images.length > 0 ? 
              `<img src="${item.images[0]}" alt="${item.title}" loading="lazy">` :
              '<div class="placeholder-image"><i class="fas fa-image"></i></div>'
            }
          </div>
          
          <div class="product-badges">
            ${item.seller.verified ? '<span class="badge verified"><i class="fa fa-check-circle"></i> Verified</span>' : ''}
            ${item.featured ? '<span class="badge top"><i class="fa fa-star"></i> Featured</span>' : ''}
            ${isNewItem(item.createdAt) ? '<span class="badge new">New</span>' : ''}
            ${item.features.authenticated ? '<span class="badge authenticated"><i class="fa fa-shield-alt"></i> Authenticated</span>' : ''}
          </div>
          
          <div class="product-content">
            <h3 class="product-title">${item.title}</h3>
            <div class="product-meta">
              <span class="seller">by ${item.seller.name}</span>
              <span class="category">${item.category}</span>
            </div>
            
            <div class="product-rating">
              ${renderStars(item.seller.rating || 0)}
              <span class="review-count">(${item.inquiries || 0} inquiries)</span>
            </div>
            
            <p class="product-description">${truncateText(item.description, 100)}</p>
            
            <div class="product-features">
              ${item.features.materials ? `<span class="feature"><i class="fas fa-cube"></i> ${item.features.materials}</span>` : ''}
              ${item.features.origin ? `<span class="feature"><i class="fas fa-map-marker-alt"></i> ${item.features.origin}</span>` : ''}
              ${item.features.condition ? `<span class="feature"><i class="fas fa-star"></i> ${item.features.condition}</span>` : ''}
            </div>
            
            <div class="product-footer">
              <div class="price-section">
                <span class="price">${formatPrice(item.price, item.currency)}</span>
                ${item.negotiable ? '<span class="negotiable">Negotiable</span>' : ''}
              </div>
              
              <div class="product-actions">
                <button class="buy-btn" onclick="handleBuyClick('${item.id}')">
                  <i class="fas fa-shopping-cart"></i> 
                  ${item.status === 'sold' ? 'Sold' : 'Buy Now'}
                </button>
                <button class="share-btn" onclick="handleShareClick('${item.id}')">
                  <i class="fas fa-share"></i>
                </button>
                <button class="like-btn" onclick="handleLikeClick('${item.id}')">
                  <i class="fas fa-heart"></i> ${item.likes || 0}
                </button>
              </div>
            </div>
          </div>
        </div>
      `).join('');
    }

    function setupFilters() {
      const categoryFilter = document.getElementById('categoryFilter');
      const statusFilter = document.getElementById('statusFilter');
      
      categoryFilter.addEventListener('change', loadMarketplaceItems);
      statusFilter.addEventListener('change', loadMarketplaceItems);
    }

    function setupItemInteractions() {
      // Add click handlers for item details
      document.querySelectorAll('.product-card').forEach(card => {
        card.addEventListener('click', function(e) {
          // Don't trigger if clicking on buttons
          if (e.target.closest('button')) return;
          
          const itemId = this.dataset.id;
          showItemDetails(itemId);
        });
      });
    }

    function handleBuyClick(itemId) {
      // Redirect to checkout with item ID
      window.location.href = `/pages/checkoutmint.html?item=${itemId}`;
    }

    function handleShareClick(itemId) {
      // Copy share link to clipboard
      const shareUrl = `${window.location.origin}/pages/marketplace.html?item=${itemId}`;
      navigator.clipboard.writeText(shareUrl).then(() => {
        showToast('Share link copied to clipboard!');
      });
    }

    function handleLikeClick(itemId) {
      // Toggle like status
      console.log('Like clicked for item:', itemId);
      // Implement like functionality
      showToast('Added to favorites!');
    }

    function showItemDetails(itemId) {
      // Open item details modal or navigate to detail page
      console.log('Show details for item:', itemId);
      // For now, navigate to provenance page
      window.location.href = `/pages/provenance.html?item=${itemId}`;
    }

    // Helper functions
    function isNewItem(createdAt) {
      const itemDate = new Date(createdAt);
      const now = new Date();
      const daysDiff = (now - itemDate) / (1000 * 60 * 60 * 24);
      return daysDiff <= 7; // New if within 7 days
    }

    function renderStars(rating) {
      const fullStars = Math.floor(rating);
      const halfStar = rating % 1 >= 0.5;
      let stars = '';
      
      for (let i = 0; i < 5; i++) {
        if (i < fullStars) {
          stars += '<i class="fas fa-star"></i>';
        } else if (i === fullStars && halfStar) {
          stars += '<i class="fas fa-star-half-alt"></i>';
        } else {
          stars += '<i class="far fa-star"></i>';
        }
      }
      
      return stars;
    }

    function truncateText(text, maxLength) {
      if (text.length <= maxLength) return text;
      return text.substring(0, maxLength) + '...';
    }

    function formatPrice(price, currency = 'USD') {
      return new Intl.NumberFormat('en-US', {
        style: 'currency',
        currency: currency
      }).format(price);
    }

    function showToast(message) {
      // Simple toast notification
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = message;
      toast.style.cssText = `
        position: fixed;
        top: 20px;
        right: 20px;
        background: var(--accent);
        color: #000;
        padding: 12px 20px;
        border-radius: 8px;
        z-index: 1000;
        font-weight: 500;
      `;
      
      document.body.appendChild(toast);
      
      setTimeout(() => {
        toast.remove();
      }, 3000);
    }
  </script>

  <style>
    .marketplace-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .marketplace-title h1 {
      font-size: 2rem;
      font-weight: 700;
      color: var(--gold);
      margin: 0;
    }

    .marketplace-filters {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .marketplace-filters select {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-light);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    .product-image {
      position: relative;
      width: 100%;
      height: 200px;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 1rem;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .placeholder-image {
      width: 100%;
      height: 100%;
      background: var(--primary-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 2rem;
    }

    .product-features {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin: 1rem 0;
    }

    .feature {
      background: var(--primary-dark);
      color: var(--text-light);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .product-footer {
      margin-top: auto;
    }

    .price-section {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .price {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--accent);
    }

    .negotiable {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-style: italic;
    }

    .product-actions {
      display: flex;
      gap: 0.5rem;
    }

    .like-btn {
      background: none;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .like-btn:hover {
      color: #e74c3c;
      border-color: #e74c3c;
    }

    .empty-state, .error-state {
      text-align: center;
      padding: 4rem 2rem;
      grid-column: 1 / -1;
    }

    .loading {
      grid-column: 1 / -1;
      text-align: center;
      padding: 2rem;
      color: var(--text-muted);
    }

    .badge.authenticated {
      background: var(--accent-dark);
      color: white;
    }
  </style>

  <script src="/public/js/realtime-updates.js" defer></script>
  <script>
    // Marketplace specific real-time update handlers
    document.addEventListener('DOMContentLoaded', function() {
      // Function to load marketplace items
      window.loadMarketplaceItems = async function() {
        try {
          const response = await fetch('/api/submissions/marketplace');
          if (response.ok) {
            const items = await response.json();
            updateMarketplaceDisplay(items);
          }
        } catch (error) {
          console.error('Error loading marketplace items:', error);
        }
      };

      // Function to update the marketplace display
      function updateMarketplaceDisplay(items) {
        const container = document.querySelector('.marketplace-grid') || document.querySelector('.items-grid');
        if (!container) return;

        // Update the display with new items
        items.forEach(item => {
          // Check if item already exists
          if (!document.querySelector(`[data-item-id="${item.id}"]`)) {
            const itemElement = createMarketplaceItemElement(item);
            container.insertBefore(itemElement, container.firstChild);
          }
        });
      }

      // Create marketplace item element
      function createMarketplaceItemElement(item) {
        const div = document.createElement('div');
        div.className = 'marketplace-item';
        div.setAttribute('data-item-id', item.id);
        div.innerHTML = `
          <div class="item-image">
            <img src="${item.images?.[0] || '/public/images/placeholder.jpg'}" alt="${item.title}" />
          </div>
          <div class="item-details">
            <h3>${item.title}</h3>
            <p class="item-description">${item.description}</p>
            <div class="item-price">$${item.price}</div>
            <div class="item-seller">By ${item.seller?.name || 'Unknown'}</div>
          </div>
        `;
        return div;
      }

      // Add listener for new marketplace listings
      if (window.PVARealtimeManager) {
        window.PVARealtimeManager.addListener('new_marketplace_listing', function(data) {
          updateMarketplaceDisplay([data]);
        });
      }

      // Load initial data
      loadMarketplaceItems();
    });
  </script>
</body>
</html>
