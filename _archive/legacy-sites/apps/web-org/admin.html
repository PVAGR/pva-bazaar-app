<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PVA Bazaar — Admin</title>
    <link href="/style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Admin — Pending Submissions</h1>
        <nav><a href="/blog.html" class="note">← Blogs</a></nav>
      </header>

      <div class="field">
        <label>Admin Secret</label>
        <input id="secret" placeholder="Enter ADMIN_SECRET_CODE" />
        <div class="note">Stored locally in session for requests.</div>
        <button id="saveSecret" style="margin-top: 0.5rem">Save Secret</button>
        <button id="loadPending" class="note" style="margin-top: 0.5rem">Load Pending</button>
      </div>

      <div id="list" class="grid" style="margin-top: 1rem"></div>

      <hr style="margin: 1.5rem 0" />
      <section>
        <h2>Pending Comments</h2>
        <div class="note">Approve or delete comments awaiting moderation.</div>
        <div style="margin-top: 0.5rem">
          <button id="loadComments">Load Pending Comments</button>
        </div>
        <div id="commentsList" class="grid" style="margin-top: 1rem"></div>
      </section>
    </div>

    <script>
      const secretInput = document.getElementById('secret');
      const saveBtn = document.getElementById('saveSecret');
      const loadBtn = document.getElementById('loadPending');
      const listEl = document.getElementById('list');
      const loadCommentsBtn = document.getElementById('loadComments');
      const commentsListEl = document.getElementById('commentsList');

      secretInput.value = sessionStorage.getItem('ADMIN_SECRET_CODE') || '';

      saveBtn.addEventListener('click', () => {
        sessionStorage.setItem('ADMIN_SECRET_CODE', secretInput.value);
        alert('Saved');
      });

      loadBtn.addEventListener('click', async () => {
        const secret = sessionStorage.getItem('ADMIN_SECRET_CODE') || '';
        if (!secret) return alert('Enter and save the admin secret');
        const res = await fetch(`/api/blogs/pending?secret=${encodeURIComponent(secret)}`);
        const data = await res.json();
        if (!data.ok) return alert(data.message || 'Failed to load');
        listEl.innerHTML = '';
        (data.blogs || []).forEach((b) => {
          const div = document.createElement('div');
          div.className = 'card';
          div.innerHTML = `<strong>${b.title}</strong> <span class="note">(${b.slug})</span> <div style="margin-top:0.5rem"><button data-slug="${b.slug}">Publish</button></div>`;
          const btn = div.querySelector('button');
          btn.addEventListener('click', async () => {
            const res2 = await fetch(`/api/blogs/${encodeURIComponent(b.slug)}/publish`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ secret }),
            });
            const d2 = await res2.json();
            if (!d2.ok) return alert(d2.message || 'Publish failed');
            alert('Published. Edit secret: ' + (d2.editSecret || '(see API response)'));
            loadBtn.click();
          });
          listEl.appendChild(div);
        });
      });

      loadCommentsBtn.addEventListener('click', async () => {
        const secret = sessionStorage.getItem('ADMIN_SECRET_CODE') || '';
        if (!secret) return alert('Enter and save the admin secret');
        const res = await fetch(`/api/comments/pending?secret=${encodeURIComponent(secret)}`);
        const data = await res.json();
        if (!data.ok) return alert(data.message || 'Failed to load comments');
        commentsListEl.innerHTML = '';
        (data.comments || []).forEach((c) => {
          const div = document.createElement('div');
          div.className = 'card';
          const meta = document.createElement('div');
          meta.className = 'note';
          meta.textContent = `${c.authorName || 'Anon'} on ${c.blogSlug}`;
          const body = document.createElement('div');
          body.textContent = c.body || '';
          const actions = document.createElement('div');
          actions.style.marginTop = '0.5rem';
          const approveBtn = document.createElement('button');
          approveBtn.textContent = 'Approve';
          const deleteBtn = document.createElement('button');
          deleteBtn.textContent = 'Delete';
          deleteBtn.style.marginLeft = '0.5rem';
          approveBtn.addEventListener('click', async () => {
            const r = await fetch(`/api/comments/${encodeURIComponent(c._id)}/approve`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ secret }),
            });
            const d = await r.json();
            if (!d.ok) return alert(d.message || 'Approve failed');
            loadCommentsBtn.click();
          });
          deleteBtn.addEventListener('click', async () => {
            const r = await fetch(`/api/comments/${encodeURIComponent(c._id)}/delete`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ secret }),
            });
            const d = await r.json();
            if (!d.ok) return alert(d.message || 'Delete failed');
            loadCommentsBtn.click();
          });
          actions.appendChild(approveBtn);
          actions.appendChild(deleteBtn);
          div.appendChild(meta);
          div.appendChild(body);
          div.appendChild(actions);
          commentsListEl.appendChild(div);
        });
      });
    </script>
  </body>
</html>
