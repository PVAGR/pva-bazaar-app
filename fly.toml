app = "pva-bazaar"
primary_region = "iad"  # US East (Dulles, Virginia)

[build]
  builder = "dockerfile"
  dockerfile = "./Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "5001"

[[services]]
  internal_port = 5001
  processes = ["app"]
  protocol = "tcp"
  [services.concurrency]
    hard_limit = 25
    soft_limit = 20
  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true
  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
  [services.tcp_checks]
    enabled = true
    grace_period = "10s"
    interval = "15s"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[env.processes.app]
  DOCKER_BUILDKIT = "1"

# Enable auto-scaling (free tier allows 1 instance)
[processes]
  app = "npm start"

# Health checks
[[http_checks]]
  grace_period = "30s"
  interval = "10s"
  method = "GET"
  path = "/api/health-check"
  protocol = "http"
  timeout = "5s"
