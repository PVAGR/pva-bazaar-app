# Railway.app Configuration for PVA Bazaar
# Deployment: git push origin main → Railway automatically deploys

[build]
builder = "dockerfile"
dockerfilePath = "./Dockerfile"

[deploy]
startCommand = "npm start"
restartPolicyType = "always"
restartPolicyMaxRetries = 5

[[services]]
name = "mongodb"
icon = "mongodb"
source = "railway"

[services.variables]
MONGO_INITDB_ROOT_USERNAME = "$MONGODB_USER"
MONGO_INITDB_ROOT_PASSWORD = "$MONGODB_PASSWORD"

[[services.tcp_ports]]
localPort = 27017
publicPort = 27017
