name: 🚀 Auto-Deploy to Render.com

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: 🔧 Prepare deployment
        run: |
          echo "Deployment package ready"
          ls -la

      - name: 🚀 Deploy to Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK || vars.RENDER_DEPLOY_HOOK || secrets.RENDER_DEPLOY_HOOK_URL || vars.RENDER_DEPLOY_HOOK_URL || secrets.RENDER_WEBHOOK_URL || vars.RENDER_WEBHOOK_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY || vars.RENDER_API_KEY || secrets.RENDER_API_TOKEN || vars.RENDER_API_TOKEN || secrets.RENDER_AUTH_TOKEN || vars.RENDER_AUTH_TOKEN }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID || vars.RENDER_SERVICE_ID || secrets.RENDER_BACKEND_SERVICE_ID || vars.RENDER_BACKEND_SERVICE_ID || secrets.RENDER_API_SERVICE_ID || vars.RENDER_API_SERVICE_ID }}
        run: |
          echo "📡 Triggering Render deployment via webhook..."
          if [ -n "${RENDER_DEPLOY_HOOK:-}" ]; then
            status=$(curl -sS -o /tmp/render_hook_response.txt -w "%{http_code}" -X POST "${RENDER_DEPLOY_HOOK}")
            echo "Render webhook HTTP status: ${status}"
            cat /tmp/render_hook_response.txt || true

            if [ "${status}" -lt 200 ] || [ "${status}" -ge 300 ]; then
              echo "::error title=Render deploy hook failed::Webhook returned HTTP ${status}"
              exit 1
            fi
            exit 0
          fi

          if [ -n "${RENDER_API_KEY:-}" ] && [ -n "${RENDER_SERVICE_ID:-}" ]; then
            echo "Webhook not configured. Falling back to Render API deploy trigger..."
            status=$(curl -sS -o /tmp/render_api_response.txt -w "%{http_code}" \
              -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Content-Type: application/json")
            echo "Render API HTTP status: ${status}"
            cat /tmp/render_api_response.txt || true

            if [ "${status}" -lt 200 ] || [ "${status}" -ge 300 ]; then
              echo "::error title=Render API deploy failed::API returned HTTP ${status}"
              exit 1
            fi
            exit 0
          fi

          echo "::error title=Missing Render deployment credentials::Set deploy hook or Render API key + service id"
          exit 1

      - name: ✅ Deployment triggered
        run: |
          echo "✅ App queued for deployment on Render.com"
          echo "📊 Check status: https://dashboard.render.com"
