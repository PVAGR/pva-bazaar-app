name: TEMP Create Sanctuary Vercel Project

on:
  workflow_dispatch:

jobs:
  create-project:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      secrets: write
    steps:
      - uses: actions/checkout@v4

      - name: Create Vercel project (if missing)
        id: create
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          set -euo pipefail
          echo "Checking for existing project..."
          LIST=$(curl -s -f -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v9/projects?limit=100")
          PROJECT_ID=$(echo "$LIST" | node -e "
            let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{
              try{const j=JSON.parse(d);const p=j.projects.find(x=>x.name==='pva-bazaar-web');
              if(p){console.log(p.id)}else{console.log('')}}catch(e){console.log('')}})
          ")
          if [ -n "$PROJECT_ID" ]; then
            echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
            echo "Found existing project: $PROJECT_ID"
            exit 0
          fi

          echo "Creating project..."
          BODY=$(node -e "
            const spec = {
              name: 'pva-bazaar-web',
              framework: 'nextjs',
              rootDirectory: 'apps/pva-bazaar-web',
              buildCommand: 'npm run build',
              installCommand: 'npm install --legacy-peer-deps',
              projectSettings: { framework: 'nextjs', rootDirectory: 'apps/pva-bazaar-web' },
            };
            console.log(JSON.stringify(spec));
          ")
          RESP=$(curl -s -X POST "https://api.vercel.com/v9/projects?teamId=${VERCEL_ORG_ID}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$BODY")
          PROJECT_ID=$(echo "$RESP" | node -e "
            let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{
              try{const j=JSON.parse(d);console.log(j.id||'')}catch(e){console.log('')}})
          ")
          if [ -z "$PROJECT_ID" ]; then
            echo "Failed to create project. Response: $RESP"
            exit 1
          fi
          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "Created project: $PROJECT_ID"

      - name: Set env vars on project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          PROJECT_ID: ${{ steps.create.outputs.project_id }}
        run: |
          set -euo pipefail
          echo "PROJECT_ID: ${PROJECT_ID}"
          for PAIR in "NEXT_PUBLIC_API_URL=https://pva-backend-api.vercel.app" "NEXT_PUBLIC_SITE_URL=https://sanctuary.pvabazaar.org" "NEXT_PUBLIC_VERIFICATION_API_URL=https://pva-backend-api.vercel.app"; do
            KEY="${PAIR%%=*}"
            VALUE="${PAIR#*=}"
            echo "Setting ${KEY}..."
            curl -s -X POST "https://api.vercel.com/v10/projects/${PROJECT_ID}/env?teamId=${VERCEL_ORG_ID}" \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"key\":\"${KEY}\",\"value\":\"${VALUE}\",\"type\":\"encrypted\",\"target\":[\"production\",\"preview\",\"development\"]}" \
              || echo "Env set returned non-zero (may already exist)"
          done

      - name: Set VERCEL_SANCTUARY_PROJECT_ID secret
        env:
          PROJECT_ID: ${{ steps.create.outputs.project_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "$PROJECT_ID" | gh secret set VERCEL_SANCTUARY_PROJECT_ID --repo "${{ github.repository }}"
          echo "Secret VERCEL_SANCTUARY_PROJECT_ID set to $PROJECT_ID"
