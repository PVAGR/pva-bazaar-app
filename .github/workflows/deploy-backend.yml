name: Deploy Backend to Vercel

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci --legacy-peer-deps

      - name: Create .vercelignore
        run: |
          cat > backend/.vercelignore <<EOF
          node_modules
          .env.local
          .env.*.local
          *.md
          .git
          EOF

      - name: Deploy Backend to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN || secrets.VERCEL_API_TOKEN }}
          vercel-args: '--prod'
          working-directory: ./backend
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID || vars.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_BACKEND_PROJECT_ID || secrets.VERCEL_PROJECT_ID || vars.VERCEL_BACKEND_PROJECT_ID || vars.VERCEL_PROJECT_ID }}
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Get Backend URL
        id: backend
        run: |
          # Extract backend URL from Vercel deployment
          echo "Backend deployment completed"

      - name: Verify decentralized live endpoints
        env:
          BACKEND_URL: https://pva-backend-api.vercel.app
        run: |
          set -euo pipefail
          for i in {1..18}; do
            echo "[verify-live-decentralized] attempt ${i}/18"
            if npm run verify:live:decentralized; then
              echo "decentralized live verification passed"
              exit 0
            fi
            echo "verification not ready yet, waiting 10s"
            sleep 10
          done

          echo "decentralized live verification failed after retries"
          exit 1

      - name: Update GitHub Deployment Status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.ref,
              environment: 'production',
              description: 'Backend API deployment',
              production_environment: true,
              auto_merge: false,
              required_contexts: []
            })
