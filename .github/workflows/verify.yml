name: Verify Artifacts

on:
  push:
    branches: [main, develop]
    paths:
      - 'artifacts/**'
      - 'scripts/verify_artifact.py'
      - 'scripts/trusted_hashes.json'
  pull_request:
    branches: [main, develop]
    paths:
      - 'artifacts/**'
      - 'scripts/verify_artifact.py'
      - 'scripts/trusted_hashes.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Hash verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Find artifact files
        run: |
          if [ -d artifacts ]; then
            find artifacts -type f \( -iname '*.iso' -o -iname '*.bin' -o -iname '*.cue' \) > /tmp/artifacts.txt || true
          else
            : > /tmp/artifacts.txt
          fi

          COUNT=$(wc -l < /tmp/artifacts.txt | tr -d ' ')
          echo "artifact_count=$COUNT" >> "$GITHUB_ENV"
          echo "Artifact files found: $COUNT"

      - name: Verify artifacts
        run: |
          if [ "${artifact_count:-0}" = "0" ]; then
            echo "No artifact files under artifacts/ - nothing to verify."
            : > /tmp/verified.txt
            exit 0
          fi

          FAILED=0
          : > /tmp/verified.txt

          while IFS= read -r path; do
            [ -z "$path" ] && continue
            echo "Verifying: $path"

            if python3 scripts/verify_artifact.py "$path" --json > /tmp/result.json 2>/tmp/stderr.txt; then
              echo "OK: verified"
              BASENAME=$(basename "$path" | sed 's/\.[^.]*$//')
              printf "%s::%s\n" "$path" "$BASENAME" >> /tmp/verified.txt
            else
              echo "INTEGRITY COMPROMISED"
              cat /tmp/result.json 2>/dev/null || cat /tmp/stderr.txt || true
              FAILED=$((FAILED + 1))
            fi
          done < /tmp/artifacts.txt

          if [ "$FAILED" -gt 0 ]; then
            echo "Integrity compromised: $FAILED artifact(s) failed verification."
            exit 1
          fi

          echo "All artifacts verified."

      - name: Store verification results (optional)
        if: env.artifact_count != '0'
        env:
          VERIFY_API_URL: ${{ secrets.VERIFY_API_URL }}
          VERIFY_API_SECRET: ${{ secrets.VERIFY_API_SECRET }}
        run: |
          if [ -z "$VERIFY_API_URL" ]; then
            echo "VERIFY_API_URL is not set; skipping result storage."
            exit 0
          fi

          if [ ! -s /tmp/verified.txt ]; then
            echo "No verified artifacts to store."
            exit 0
          fi

          API_URL="${VERIFY_API_URL%/}"

          while IFS= read -r line; do
            [ -z "$line" ] && continue
            FILE_PATH="${line%%::*}"
            SLUG="${line#*::}"
            [ -z "$FILE_PATH" ] && continue

            python3 scripts/verify_artifact.py "$FILE_PATH" --json > /tmp/result.json 2>/dev/null || true

            BODY=$(SLUG="$SLUG" python3 -c "import json, os; data = json.load(open('/tmp/result.json')); print(json.dumps({'artifactIdOrSlug': os.environ.get('SLUG', ''), 'is_authentic': data.get('is_authentic', False), 'confidence_score': data.get('confidence_score', 0), 'computed_hash': data.get('computed_hash'), 'status': data.get('status', 'unknown'), 'message': data.get('message'), 'source': 'ci', 'matched_entry': data.get('matched_entry')}))")

            CURL_OPTS=(-s -X POST "${API_URL}/api/verification" -H "Content-Type: application/json" -d "$BODY")
            if [ -n "$VERIFY_API_SECRET" ]; then
              CURL_OPTS+=(-H "X-Verify-Secret: $VERIFY_API_SECRET")
            fi

            RESP=$(curl "${CURL_OPTS[@]}")
            if echo "$RESP" | grep -q '"ok":true'; then
              echo "Stored verification for $SLUG"
            else
              echo "Failed to store verification for $SLUG: $RESP"
            fi
          done < /tmp/verified.txt
