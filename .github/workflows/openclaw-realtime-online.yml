name: OpenClaw Realtime Online

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  models: read

concurrency:
  group: openclaw-realtime-online
  cancel-in-progress: true

jobs:
  realtime:
    if: github.event_name != 'schedule' || vars.OPENCLAW_CRON_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 58
    env:
      OPENCLAW_BACKEND_URL: ${{ vars.OPENCLAW_BACKEND_URL || 'https://pva-backend-api.vercel.app' }}
      OLLAMA_BASE_URL: ${{ vars.OLLAMA_BASE_URL || vars.OPENCLAW_OLLAMA_BASE_URL || '' }}
      OPENCLAW_BRIDGE_SECRET: ${{ secrets.OPENCLAW_BRIDGE_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Run realtime loop
        shell: bash
        env:
          OPENCLAW_BACKEND_URL: ${{ env.OPENCLAW_BACKEND_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          OLLAMA_BASE_URL: ${{ env.OLLAMA_BASE_URL }}
          OLLAMA_MODEL: llama3.1
          OLLAMA_TEMPERATURE: '0.35'
        run: |
          end=$((SECONDS + 3300))
          cycle=0
          while [ $SECONDS -lt $end ]; do
            cycle=$((cycle + 1))
            echo "[Realtime] Cycle $cycle starting"

            node .github/scripts/openclaw-respond.mjs || true

            echo "[Realtime] Cycle $cycle complete"
            sleep 1
          done

      - name: Notify Telegram on startup
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ -z "$OPENCLAW_BRIDGE_SECRET" ]; then
            echo "OPENCLAW_BRIDGE_SECRET missing; skipping Telegram startup notification"
            exit 0
          fi
          CHAT_ID="${TELEGRAM_ALLOWED_CHAT_IDS%%,*}"
          PAYLOAD='{}'
          if [ -n "$CHAT_ID" ]; then
            PAYLOAD="{\"chatId\":\"${CHAT_ID}\"}"
          fi
          STATUS=$(curl -sS -o /tmp/openclaw-telegram-notify.json -w "%{http_code}" \
            -X POST "${OPENCLAW_BACKEND_URL}/api/openclaw/telegram/notify-ready" \
            -H "X-OpenClaw-Secret: ${OPENCLAW_BRIDGE_SECRET}" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            --max-time 20 || true)
          echo "notify-ready status: $STATUS"
          cat /tmp/openclaw-telegram-notify.json || true
        env:
          TELEGRAM_ALLOWED_CHAT_IDS: ${{ vars.TELEGRAM_ALLOWED_CHAT_IDS || secrets.TELEGRAM_ALLOWED_CHAT_IDS || '' }}
