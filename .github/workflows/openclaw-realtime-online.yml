name: OpenClaw Realtime Online

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  models: read

concurrency:
  group: openclaw-realtime-online
  cancel-in-progress: true

jobs:
  realtime:
    runs-on: ubuntu-latest
    timeout-minutes: 58

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Run realtime loop
        shell: bash
        env:
          OPENCLAW_BACKEND_URL: https://api.pvabazaar.org
          GITHUB_TOKEN: ${{ github.token }}
          OLLAMA_BASE_URL: https://api.pvabazaar.org
          OLLAMA_MODEL: llama3.1
          OLLAMA_TEMPERATURE: '0.35'
        run: |
          end=$((SECONDS + 3300))
          cycle=0
          while [ $SECONDS -lt $end ]; do
            cycle=$((cycle + 1))
            echo "[Realtime] Cycle $cycle starting"

            node .github/scripts/openclaw-respond.mjs || true

            echo "[Realtime] Cycle $cycle complete"
            sleep 1
          done
