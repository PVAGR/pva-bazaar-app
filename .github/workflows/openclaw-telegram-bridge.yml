name: OpenClaw Telegram Bridge

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openclaw-telegram-bridge
  cancel-in-progress: false

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'

      - name: Run Telegram Bridge Worker
        run: node .github/scripts/openclaw-telegram-bridge.mjs
        env:
          OPENCLAW_BACKEND_URL: https://api.pvabazaar.org
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_IDS: ''
          TELEGRAM_PUBLIC_MODE: 'true'
          TELEGRAM_STATE_KEY: telegram:lastUpdateId
          TELEGRAM_POLL_LIMIT: '25'
          OPENCLAW_CHAT_TIMEOUT_MS: '18000'
          OPENCLAW_TELEGRAM_SOURCE: telegram-openclaw-bridge
          OPENCLAW_DIRECT_MODEL_TIMEOUT_MS: 20000
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OLLAMA_BASE_URL: https://api.pvabazaar.org
          OLLAMA_MODEL: llama3.1
          OLLAMA_TEMPERATURE: '0.35'
