name: OpenClaw Telegram Bridge

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openclaw-telegram-bridge
  cancel-in-progress: false

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      OPENCLAW_BACKEND_URL: ${{ vars.OPENCLAW_BACKEND_URL || 'https://pva-bazaar-app-1.onrender.com' }}
      OLLAMA_BASE_URL: ${{ vars.OLLAMA_BASE_URL || vars.OPENCLAW_OLLAMA_BASE_URL || '' }}
      OPENCLAW_BRIDGE_SECRET: ${{ secrets.OPENCLAW_BRIDGE_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'

      - name: Run Telegram Bridge Worker
        run: node .github/scripts/openclaw-telegram-bridge.mjs
        env:
          OPENCLAW_BACKEND_URL: ${{ env.OPENCLAW_BACKEND_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_IDS: ''
          TELEGRAM_PUBLIC_MODE: 'true'
          TELEGRAM_STATE_KEY: telegram:lastUpdateId
          TELEGRAM_POLL_LIMIT: '25'
          OPENCLAW_CHAT_TIMEOUT_MS: '18000'
          OPENCLAW_TELEGRAM_SOURCE: telegram-openclaw-bridge
          OPENCLAW_DIRECT_MODEL_TIMEOUT_MS: 20000
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OLLAMA_BASE_URL: ${{ env.OLLAMA_BASE_URL }}
          OLLAMA_MODEL: llama3.1
          OLLAMA_TEMPERATURE: '0.35'

      - name: Notify Telegram on startup
        run: |
          if [ -z "$OPENCLAW_BRIDGE_SECRET" ]; then
            echo "OPENCLAW_BRIDGE_SECRET missing; skipping Telegram startup notification"
            exit 0
          fi
          STATUS=$(curl -sS -o /tmp/openclaw-telegram-notify.json -w "%{http_code}" \
            -X POST "${OPENCLAW_BACKEND_URL}/api/openclaw/telegram/notify-ready" \
            -H "X-OpenClaw-Secret: ${OPENCLAW_BRIDGE_SECRET}" \
            -H "Content-Type: application/json" \
            --max-time 20 || true)
          echo "notify-ready status: $STATUS"
          cat /tmp/openclaw-telegram-notify.json || true
