name: Frontend Tests & Deploy

on:
  push:
    branches: [main, develop]
    paths:
      - 'Frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'Frontend/**'

jobs:
  theme-guards:
    name: Theme Guardrails
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'Frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./Frontend
        run: npm ci || npm install --no-audit --no-fund

      - name: Run src theme guard
        working-directory: ./Frontend
        run: npm run check:theme

      - name: Run static theme audit
        working-directory: ./Frontend
        run: npm run audit:theme:static

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Run npm audit
        working-directory: ./Frontend
        run: npm audit --audit-level=moderate
        continue-on-error: true

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'Frontend/package-lock.json'
      
      - name: Install dependencies
        working-directory: ./Frontend
        run: npm install --no-audit --no-fund
      
      - name: Run ESLint
        working-directory: ./Frontend
        run: npm run lint
        continue-on-error: true

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'Frontend/package-lock.json'
      
      - name: Install dependencies
        working-directory: ./Frontend
        run: npm install --no-audit --no-fund
      
      - name: Run tests
        working-directory: ./Frontend
        run: npm test
        continue-on-error: true
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./Frontend/coverage/coverage-final.json
          flags: frontend

  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [theme-guards, security, lint]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'Frontend/package-lock.json'
      
      - name: Install dependencies
        working-directory: ./Frontend
        run: npm ci 2>&1 || npm install --no-audit --no-fund 2>&1
      
      - name: Verify Node and npm
        run: |
          echo "Node version:"
          node --version
          echo "npm version:"
          npm --version
          echo ""
          echo "Frontend directory contents:"
          ls -la Frontend/ | head -20
      
      - name: Build frontend
        working-directory: ./Frontend
        env:
          VITE_API_URL: https://api.pvabazaar.org/api
          VITE_CLOUDINARY_CLOUD_NAME: ''
          VITE_CLOUDINARY_UPLOAD_PRESET: ''
          VITE_FEDERATION_ENABLED: 'false'
        run: |
          set -x
          node scripts/vercel-info.cjs
          npx vite build
          node scripts/copy-src-to-dist.cjs
          echo "All build steps completed successfully"

      - name: Verify build output
        working-directory: ./Frontend
        run: |
          if [ ! -d "dist" ]; then
            echo "ERROR: dist directory not created"
            ls -la
            exit 1
          fi
          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html not found"
            ls -la dist/ | head -20
            exit 1
          fi
          echo "✓ Build output verified"
          echo "dist/ contains:"
          ls -la dist/ | head -20
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: Frontend/dist

  deploy-github-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [build]
    # Disabled: canonical Pages deploy is handled by deploy-frontend.yml
    if: false
    permissions:
      contents: read
      pages: write
      id-token: write
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'Frontend/package-lock.json'
      
      - name: Install dependencies
        working-directory: ./Frontend
        run: npm install --no-audit --no-fund
      
      - name: Build frontend
        working-directory: ./Frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL_PRODUCTION }}
        run: npm run build
      
      - name: Setup Pages
        uses: actions/configure-pages@v3
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'Frontend/dist'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: [build]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'Frontend/package-lock.json'
      
      - name: Install dependencies
        working-directory: ./Frontend
        run: npm install --no-audit --no-fund
      
      - name: Build frontend
        working-directory: ./Frontend
        run: npm run build
      
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v9
        with:
          configPath: './Frontend/lighthouserc.json'
          temporaryPublicStorage: true
        continue-on-error: true
