name: Fetch Vercel Runtime Logs

on:
  workflow_dispatch:

jobs:
  fetch-logs:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch deployment details and build events
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.VERCEL_API_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID || secrets.VERCEL_PROJECT_ID || vars.VERCEL_BACKEND_PROJECT_ID || vars.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          echo "=== Top 5 production deployments: state + alias assignment ==="
          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&target=production&limit=5" \
            | jq '[.deployments[] | {uid, state: .readyState, aliasAssigned, created: .createdAt, url}]'
          echo ""
          echo "=== Response headers from failing production domain ==="
          curl -sS -D - -o /dev/null --max-time 30 "https://pva-backend-api.vercel.app/api/health" | head -40
          echo ""
          echo "=== Full deployment object (v13) for latest READY production deployment ==="
          READY_UID=$(curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&target=production&limit=5&state=READY" \
            | jq -r '.deployments[0].uid')
          echo "READY_UID=$READY_UID"
          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$READY_UID" \
            | jq '{uid, state: .readyState, aliasAssigned, aliasError, routes, functions: (.functions | keys?)}'
          echo ""
          echo "=== Last 10 deployments of ALL targets (look for ERROR states) ==="
          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&limit=10" \
            | jq '[.deployments[] | {uid, state: .readyState, target, created: .createdAt, url}]'

      - name: Fetch production runtime error logs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.VERCEL_API_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID || secrets.VERCEL_PROJECT_ID || vars.VERCEL_BACKEND_PROJECT_ID || vars.VERCEL_PROJECT_ID }}
        run: |
          npm install --global vercel@latest
          CLEAN_TOKEN="$(printf '%s' "$VERCEL_TOKEN" | tr -d '[:space:]')"
          echo "=== runtime error logs (production, last 3h) ==="
          vercel logs https://pva-backend-api.vercel.app --token="$CLEAN_TOKEN" --scope="$VERCEL_ORG_ID" --level error --since 3h --json 2>&1 | head -c 12000 || true
          echo ""
          echo "=== runtime logs for HTTP 500 (production) ==="
          vercel logs https://pva-backend-api.vercel.app --token="$CLEAN_TOKEN" --scope="$VERCEL_ORG_ID" --status-code 500 --json 2>&1 | head -c 12000 || true
