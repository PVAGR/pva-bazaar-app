name: Deploy Web to Vercel

on:
  push:
    branches: [main]
    paths:
      - 'Frontend/**'
      - '.github/workflows/deploy-web-vercel.yml'
  workflow_dispatch:
    inputs:
      ref_to_deploy:
        description: 'Commit, tag, or branch to deploy/rollback'
        required: false
        type: string
        default: ''
      rollback_reason:
        description: 'Reason for redeploying a known-good ref'
        required: false
        type: string
        default: ''

jobs:
  preflight-readiness:
    name: Preflight live readiness
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref_to_deploy || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Run baseline live readiness gate
        env:
          FRONTEND_URL: https://pvabazaar.org
          BACKEND_URL: https://api.pvabazaar.org
        run: node scripts/verify-live-ready.mjs

  deploy-frontend:
    name: Deploy frontend to Vercel (Production)
    needs: preflight-readiness
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID || vars.VERCEL_FRONTEND_PROJECT_ID || secrets.VERCEL_PROJECT_ID || vars.VERCEL_PROJECT_ID }}
      VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME || vars.VITE_CLOUDINARY_CLOUD_NAME || '' }}
      VITE_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET || vars.VITE_CLOUDINARY_UPLOAD_PRESET || '' }}

    defaults:
      run:
        working-directory: Frontend

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref_to_deploy || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Validate Vercel production secrets
        run: |
          missing=0
          for name in VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing required Vercel setting::${name} is not configured"
              missing=1
            fi
          done
          if [ -z "${{ secrets.VERCEL_TOKEN || secrets.VERCEL_API_TOKEN }}" ]; then
            echo "::error title=Missing required Vercel setting::VERCEL_TOKEN/VERCEL_API_TOKEN is not configured"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Pull Vercel env (Production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN || secrets.VERCEL_API_TOKEN }}

      - name: Build (prebuilt)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN || secrets.VERCEL_API_TOKEN }}

      - name: Deploy to Production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN || secrets.VERCEL_API_TOKEN }}

      - name: Verify backend health (direct)
        run: |
          curl -I -L https://api.pvabazaar.org/api/health || exit 1

      - name: Verify strict post-deploy readiness
        env:
          FRONTEND_URL: https://pvabazaar.org
          BACKEND_URL: https://api.pvabazaar.org
          STRICT: 'true'
          WAIT_TIMEOUT_MS: '300000'
          WAIT_POLL_MS: '10000'
        run: node ../scripts/verify-live-ready.mjs && node ../scripts/verify-frontend-routes-live.mjs
