name: OpenClaw Agent Responder

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  respond:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Run OpenClaw responder
        run: node .github/scripts/openclaw-respond.mjs
        env:
          OPENCLAW_BACKEND_URL: ${{ secrets.OPENCLAW_BACKEND_URL }}
          OPENCLAW_BRIDGE_SECRET: ${{ secrets.OPENCLAW_BRIDGE_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
