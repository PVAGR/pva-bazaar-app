name: OpenClaw Agent Responder

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  models: read

concurrency:
  group: openclaw-agent-responder
  cancel-in-progress: false

jobs:
  respond:
    if: github.event_name != 'schedule' || vars.OPENCLAW_CRON_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENCLAW_BACKEND_URL: ${{ vars.OPENCLAW_BACKEND_URL || 'https://pva-backend-api.vercel.app' }}
      OPENCLAW_BRIDGE_SECRET: ${{ secrets.OPENCLAW_BRIDGE_SECRET }}
      OLLAMA_BASE_URL: ${{ vars.OLLAMA_BASE_URL || vars.OPENCLAW_OLLAMA_BASE_URL || '' }}
      OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || vars.OPENCLAW_OLLAMA_MODEL || 'llama3.1' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'

      - name: Validate backend target
        run: |
          if [ -z "$OPENCLAW_BACKEND_URL" ]; then
            echo "OPENCLAW_BACKEND_URL resolved empty"
            exit 1
          fi
          echo "Using OpenClaw backend: $OPENCLAW_BACKEND_URL"

      - name: Run OpenClaw responder
        run: node .github/scripts/openclaw-respond.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Telegram on startup
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ -z "$OPENCLAW_BRIDGE_SECRET" ]; then
            echo "OPENCLAW_BRIDGE_SECRET missing; skipping Telegram startup notification"
            exit 0
          fi
          CHAT_ID="${TELEGRAM_ALLOWED_CHAT_IDS%%,*}"
          PAYLOAD='{}'
          if [ -n "$CHAT_ID" ]; then
            PAYLOAD="{\"chatId\":\"${CHAT_ID}\"}"
          fi
          STATUS=$(curl -sS -o /tmp/openclaw-telegram-notify.json -w "%{http_code}" \
            -X POST "${OPENCLAW_BACKEND_URL}/api/openclaw/telegram/notify-ready" \
            -H "X-OpenClaw-Secret: ${OPENCLAW_BRIDGE_SECRET}" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            --max-time 20 || true)
          echo "notify-ready status: $STATUS"
          cat /tmp/openclaw-telegram-notify.json || true
        env:
          TELEGRAM_ALLOWED_CHAT_IDS: ${{ vars.TELEGRAM_ALLOWED_CHAT_IDS || secrets.TELEGRAM_ALLOWED_CHAT_IDS || '' }}
