name: OpenClaw Agent Responder

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  models: read

concurrency:
  group: openclaw-agent-responder
  cancel-in-progress: false

jobs:
  respond:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENCLAW_BACKEND_URL: ${{ vars.OPENCLAW_BACKEND_URL || 'https://pva-bazaar-app-1.onrender.com' }}
      OPENCLAW_BRIDGE_SECRET: ${{ secrets.OPENCLAW_BRIDGE_SECRET }}
      OLLAMA_BASE_URL: ${{ vars.OLLAMA_BASE_URL || vars.OPENCLAW_OLLAMA_BASE_URL || '' }}
      OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || vars.OPENCLAW_OLLAMA_MODEL || 'llama3.1' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'

      - name: Validate backend target
        run: |
          if [ -z "$OPENCLAW_BACKEND_URL" ]; then
            echo "OPENCLAW_BACKEND_URL resolved empty"
            exit 1
          fi
          echo "Using OpenClaw backend: $OPENCLAW_BACKEND_URL"

      - name: Run OpenClaw responder
        run: node .github/scripts/openclaw-respond.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
