name: OpenClaw Agent Responder

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  models: read

concurrency:
  group: openclaw-agent-responder
  cancel-in-progress: false

jobs:
  respond:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'

      - name: Run OpenClaw responder
        run: node .github/scripts/openclaw-respond.mjs
        env:
          OPENCLAW_BACKEND_URL: https://api.pvabazaar.org
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
