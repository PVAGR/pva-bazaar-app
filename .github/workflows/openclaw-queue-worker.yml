name: OpenClaw Queue Worker Tick

on:
  # Free tiers: avoid hammering the API every 5m (was burning Vercel/GitHub budgets).
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openclaw-queue-worker-tick
  cancel-in-progress: true

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      OPENCLAW_BACKEND_URL: ${{ vars.OPENCLAW_BACKEND_URL || 'https://pva-bazaar-app-1.onrender.com' }}
      OPENCLAW_WEBHOOK_URL: ${{ secrets.OPENCLAW_WEBHOOK_URL || vars.OPENCLAW_WEBHOOK_URL || '' }}
      OPENCLAW_API_KEY: ${{ secrets.OPENCLAW_API_KEY || '' }}
      OPENCLAW_BRIDGE_SECRET: ${{ secrets.OPENCLAW_BRIDGE_SECRET || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Validate worker targets
        run: |
          if [ -z "$OPENCLAW_BACKEND_URL" ]; then
            echo "OPENCLAW_BACKEND_URL is required"
            exit 1
          fi
          if [ -z "$OPENCLAW_WEBHOOK_URL" ]; then
            OPENCLAW_WEBHOOK_URL="${OPENCLAW_BACKEND_URL%/}/api/openclaw/webhook"
            echo "OPENCLAW_WEBHOOK_URL=$OPENCLAW_WEBHOOK_URL" >> "$GITHUB_ENV"
            echo "OPENCLAW_WEBHOOK_URL not set; defaulting to backend webhook endpoint"
          fi
          echo "Worker backend: $OPENCLAW_BACKEND_URL"
          echo "Worker webhook configured"

      - name: Run one-shot queue worker
        working-directory: backend
        env:
          NODE_ENV: production
          OPENCLAW_PUBLIC_MODE: 'true'
          OPENCLAW_BACKEND_URL: ${{ env.OPENCLAW_BACKEND_URL }}
          OPENCLAW_WEBHOOK_URL: ${{ env.OPENCLAW_WEBHOOK_URL }}
          OPENCLAW_API_KEY: ${{ env.OPENCLAW_API_KEY }}
          OPENCLAW_BRIDGE_SECRET: ${{ env.OPENCLAW_BRIDGE_SECRET }}
          OPENCLAW_WORKER_NAME: openclaw-queue-dispatcher-gha
          OPENCLAW_WORKER_BATCH_SIZE: 25
          OPENCLAW_WORKER_POLL_MS: 10000
          OPENCLAW_WORKER_LEASE_MS: 45000
          OPENCLAW_WORKER_REQUEST_TIMEOUT_MS: 12000
          OPENCLAW_WORKER_RETRY_BASE_MS: 15000
          OPENCLAW_WORKER_RETRY_MAX_MS: 300000
          OPENCLAW_WORKER_MAX_RETRIES: 12
          OPENCLAW_WORKER_RUN_ONCE: 'true'
        run: npm run openclaw:worker:once
