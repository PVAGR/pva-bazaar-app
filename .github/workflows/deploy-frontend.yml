name: Deploy Frontend to GitHub Pages & Vercel

on:
  push:
    branches: [ main ]
    paths:
      - 'Frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'Frontend/package-lock.json'

      - name: Install frontend dependencies
        run: |
          cd Frontend
          npm ci

      - name: Set Sentry Release (git SHA)
        id: sentry_release
        run: echo "RELEASE=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build frontend
        run: |
          cd Frontend
          npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_BASE_URL || secrets.VITE_API_URL || 'https://api.pvabazaar.org/api' }}
          VITE_BASE_PATH: '/pva-bazaar-app/'
          VITE_SENTRY_RELEASE: ${{ env.RELEASE }}

      - name: Validate dist output
        run: |
          if [ ! -d "Frontend/dist" ] || [ ! -f "Frontend/dist/index.html" ]; then
            echo "dist validation failed: dist or index.html missing" && exit 1
          fi
          echo "dist validation passed"
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'Frontend/dist'

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-vercel:
    name: Deploy Frontend to Vercel (Preview)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'Frontend/package-lock.json'

      - name: Install frontend dependencies
        run: |
          cd Frontend
          npm ci

      - name: Build frontend
        run: |
          cd Frontend
          npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://api.pvabazaar.org/api' }}

      - name: Create .vercelignore
        run: |
          cat > Frontend/.vercelignore <<EOF
          node_modules
          .env.local
          .env.*.local
          *.md
          .git
          EOF

      - name: Deploy Frontend Preview to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          working-directory: ./Frontend
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}

