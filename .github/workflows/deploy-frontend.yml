name: Deploy Frontend to GitHub Pages & Vercel

on:
  push:
    branches: [ main ]
    paths:
      - 'Frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "deploy-frontend-pages-vercel-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  theme-guards:
    name: Theme Guardrails
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'Frontend/package-lock.json'

      - name: Install frontend dependencies
        run: npm ci || npm install --no-audit --no-fund

      - name: Run src theme guard
        continue-on-error: true
        run: npm run check:theme

      - name: Run static theme audit
        continue-on-error: true
        run: npm run audit:theme:static

  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [theme-guards]
    if: ${{ always() }}
    outputs:
      main_js: ${{ steps.asset_manifest.outputs.main_js }}
      main_css: ${{ steps.asset_manifest.outputs.main_css }}
    
    defaults:
      run:
        working-directory: Frontend
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'Frontend/package-lock.json'

      - name: Install frontend dependencies
        run: npm ci || npm install --no-audit --no-fund

      - name: Set Sentry Release (git SHA)
        id: sentry_release
        run: echo "RELEASE=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://api.pvabazaar.org/api' }}
          VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME || vars.VITE_CLOUDINARY_CLOUD_NAME || '' }}
          VITE_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET || vars.VITE_CLOUDINARY_UPLOAD_PRESET || '' }}
          VITE_SENTRY_RELEASE: ${{ env.RELEASE }}

      - name: Validate dist output
        run: |
          if [ ! -d "dist" ] || [ ! -f "dist/index.html" ]; then
            echo "dist validation failed: dist or index.html missing" && exit 1
          fi
          echo "dist validation passed"

      - name: Capture asset manifest
        id: asset_manifest
        run: |
          MAIN_JS=$(grep -o '/assets/[^"'"']*\.js' dist/index.html | head -n 1)
          MAIN_CSS=$(grep -o '/assets/[^"'"']*\.css' dist/index.html | head -n 1)
          if [ -z "$MAIN_JS" ] || [ -z "$MAIN_CSS" ]; then
            echo "Failed to parse main asset filenames from dist/index.html"
            exit 1
          fi
          echo "main_js=$MAIN_JS" >> $GITHUB_OUTPUT
          echo "main_css=$MAIN_CSS" >> $GITHUB_OUTPUT
          echo "Expected JS: $MAIN_JS"
          echo "Expected CSS: $MAIN_CSS"
      
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'Frontend/dist'

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live asset propagation
        env:
          EXPECTED_JS: ${{ needs.build.outputs.main_js }}
          EXPECTED_CSS: ${{ needs.build.outputs.main_css }}
        run: |
          if [ -z "$EXPECTED_JS" ] || [ -z "$EXPECTED_CSS" ]; then
            echo "Missing expected asset outputs from build job"
            exit 1
          fi

          echo "Waiting for live site to serve expected assets..."
          echo "Expected JS: $EXPECTED_JS"
          echo "Expected CSS: $EXPECTED_CSS"

          ok=0
          for i in $(seq 1 30); do
            ts=$(date +%s)
            html=$(curl -fsSL "https://pvabazaar.org/?v=$ts" || true)

            if echo "$html" | grep -F "$EXPECTED_JS" >/dev/null && echo "$html" | grep -F "$EXPECTED_CSS" >/dev/null; then
              echo "Live asset propagation confirmed on attempt $i"
              ok=1
              break
            fi

            echo "Attempt $i/30: live HTML has not updated yet; retrying in 20s"
            sleep 20
          done

          if [ "$ok" -ne 1 ]; then
            echo "Live asset propagation check failed: expected assets not visible on pvabazaar.org"
            exit 1
          fi

  deploy-vercel:
    name: Deploy Frontend to Vercel (Preview)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    defaults:
      run:
        working-directory: Frontend
    
    steps:
      - uses: actions/checkout@v4

      - name: Validate Vercel frontend secrets
        id: vercel_secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.VERCEL_API_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || vars.VERCEL_ORG_ID }}
          VERCEL_FRONTEND_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID || vars.VERCEL_FRONTEND_PROJECT_ID || secrets.VERCEL_PROJECT_ID || vars.VERCEL_PROJECT_ID }}
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_FRONTEND_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::warning title=Missing Vercel config::${name} is not configured; skipping preview deploy"
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "ready=true" >> $GITHUB_OUTPUT
          else
            echo "ready=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node
        if: steps.vercel_secrets.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'Frontend/package-lock.json'

      - name: Install frontend dependencies
        if: steps.vercel_secrets.outputs.ready == 'true'
        run: npm ci || npm install --no-audit --no-fund

      - name: Build frontend
        if: steps.vercel_secrets.outputs.ready == 'true'
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://api.pvabazaar.org/api' }}
          VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME || vars.VITE_CLOUDINARY_CLOUD_NAME || '' }}
          VITE_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET || vars.VITE_CLOUDINARY_UPLOAD_PRESET || '' }}

      - name: Create .vercelignore
        if: steps.vercel_secrets.outputs.ready == 'true'
        run: |
          cat > .vercelignore <<EOF
          node_modules
          .env.local
          .env.*.local
          *.md
          .git
          EOF

      - name: Deploy Frontend Preview to Vercel
        if: steps.vercel_secrets.outputs.ready == 'true'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN || secrets.VERCEL_API_TOKEN }}
          working-directory: ./Frontend
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID || vars.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID || vars.VERCEL_FRONTEND_PROJECT_ID || secrets.VERCEL_PROJECT_ID || vars.VERCEL_PROJECT_ID }}

