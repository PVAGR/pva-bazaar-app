name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'Frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install and Build
        env:
          # Use GitHub repository variable (not secret) with fallback
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://pva-backend-api.vercel.app' }}
        run: |
          cd Frontend
          npm ci
          npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: Frontend/dist
          retention-days: 7

      - name: Clean and Deploy to GitHub Pages
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          # Delete existing gh-pages branch (local and remote)
          git branch -D gh-pages || true
          git push origin --delete gh-pages || true
          
          # Create fresh orphan branch
          git checkout --orphan gh-pages
          
          # Remove all files from working tree
          git rm -rf .
          
          # Copy only built dist files
          cp -r Frontend/dist/* .
          cp -r Frontend/dist/.* . 2>/dev/null || true
          
          # Add CNAME for custom domain
          echo "pvabazaar.org" > CNAME
          
          # Commit and force push
          git add .
          git commit -m "Deploy clean build from commit ${{ github.sha }}"
          git push origin gh-pages --force
