name: Deploy Frontend to GitHub Pages & Vercel
# bump: 2026-04-15 — ensure Pages rebuild picks up repo Actions vars (e.g. VITE_API_URL).

on:
  push:
    branches: [ main ]
    paths:
      - 'Frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:
    inputs:
      ref_to_deploy:
        description: "Commit, tag, or branch to deploy/rollback"
        required: false
        type: string
        default: ""
      rollback_reason:
        description: "Reason for redeploying a known-good ref"
        required: false
        type: string
        default: ""
  repository_dispatch:
    types: [heelkawn-apk-published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "deploy-frontend-pages-vercel-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  theme-guards:
    name: Theme Guardrails
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Frontend

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref_to_deploy || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps || npm install --no-audit --no-fund --legacy-peer-deps

      - name: Run src theme guard
        continue-on-error: true
        run: npm run check:theme

      - name: Run static theme audit
        continue-on-error: true
        run: npm run audit:theme:static

  preflight-readiness:
    name: Preflight Live Readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref_to_deploy || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Skip baseline live readiness gate for manual deploys
        if: github.event_name == 'workflow_dispatch'
        run: echo "Manual deploy dispatch requested; skipping baseline live readiness gate."

      - name: Run baseline live readiness gate
        if: github.event_name != 'workflow_dispatch'
        continue-on-error: true
        env:
          FRONTEND_URL: https://pvabazaar.org
          BACKEND_URL: https://pva-backend-api.vercel.app
        run: node scripts/verify-live-ready.mjs

  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [theme-guards, preflight-readiness]
    if: ${{ always() }}
    outputs:
      main_js: ${{ steps.asset_manifest.outputs.main_js }}
      main_css: ${{ steps.asset_manifest.outputs.main_css }}
    
    defaults:
      run:
        working-directory: Frontend
    
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref_to_deploy || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps || npm install --no-audit --no-fund --legacy-peer-deps

      - name: Bundle HeelKawn Android APK for pvabazaar.org
        continue-on-error: true
        run: |
          mkdir -p public/downloads
          if curl -fL --retry 3 --retry-delay 5 \
            -o public/downloads/HeelKawn-android.apk \
            "https://github.com/PVAGR/HeelKawn1/releases/download/android-latest/HeelKawn-android.apk"; then
            echo "Bundled HeelKawn Android APK for the live download tile."
          else
            echo "HeelKawn Android APK bundle unavailable; continuing site build without it."
            rm -f public/downloads/HeelKawn-android.apk
          fi
          ls -lah public/downloads/ || true

      - name: Set Sentry Release (git SHA)
        id: sentry_release
        run: echo "RELEASE=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || vars.VITE_API_BASE_URL || secrets.VITE_API_URL || 'https://pva-backend-api.vercel.app/api' }}
          VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME || vars.VITE_CLOUDINARY_CLOUD_NAME || '' }}
          VITE_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET || vars.VITE_CLOUDINARY_UPLOAD_PRESET || '' }}
          VITE_SENTRY_RELEASE: ${{ env.RELEASE }}

      - name: Validate dist output
        run: |
          if [ ! -d "dist" ] || [ ! -f "dist/index.html" ]; then
            echo "dist validation failed: dist or index.html missing" && exit 1
          fi
          echo "dist validation passed"

      - name: Capture asset manifest
        id: asset_manifest
        run: |
          MAIN_JS=$(node -e "const fs=require('fs');const html=fs.readFileSync('dist/index.html','utf8');const m=html.match(/\/assets\/[^\"']+\.js/);if(!m){process.exit(1)};process.stdout.write(m[0])")
          MAIN_CSS=$(node -e "const fs=require('fs');const html=fs.readFileSync('dist/index.html','utf8');const m=html.match(/\/assets\/[^\"']+\.css/);if(!m){process.exit(1)};process.stdout.write(m[0])")
          if [ -z "$MAIN_JS" ] || [ -z "$MAIN_CSS" ]; then
            echo "Failed to parse main asset filenames from dist/index.html"
            exit 1
          fi
          echo "main_js=$MAIN_JS" >> $GITHUB_OUTPUT
          echo "main_css=$MAIN_CSS" >> $GITHUB_OUTPUT
          echo "Expected JS: $MAIN_JS"
          echo "Expected CSS: $MAIN_CSS"
      
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'Frontend/dist'

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live asset propagation
        env:
          EXPECTED_JS: ${{ needs.build.outputs.main_js }}
          EXPECTED_CSS: ${{ needs.build.outputs.main_css }}
        run: |
          if [ -z "$EXPECTED_JS" ] || [ -z "$EXPECTED_CSS" ]; then
            echo "Missing expected asset outputs from build job"
            exit 1
          fi

          echo "Waiting for live site to serve expected assets..."
          echo "Expected JS: $EXPECTED_JS"
          echo "Expected CSS: $EXPECTED_CSS"

          ok=0
          for i in $(seq 1 30); do
            ts=$(date +%s)
            html=$(curl -fsSL "https://pvabazaar.org/?v=$ts" || true)

            if echo "$html" | grep -F "$EXPECTED_JS" >/dev/null && echo "$html" | grep -F "$EXPECTED_CSS" >/dev/null; then
              echo "Live asset propagation confirmed on attempt $i"
              ok=1
              break
            fi

            echo "Attempt $i/30: live HTML has not updated yet; retrying in 20s"
            sleep 20
          done

          if [ "$ok" -ne 1 ]; then
            echo "Live asset propagation check failed: expected assets not visible on pvabazaar.org"
            exit 1
          fi

  deploy-vercel:
    name: Deploy Frontend to Vercel (Preview)
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    
    defaults:
      run:
        working-directory: Frontend
    
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref_to_deploy || github.sha }}

      - name: Validate Vercel frontend secrets
        id: vercel_secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.VERCEL_API_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || vars.VERCEL_ORG_ID }}
          VERCEL_FRONTEND_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID || vars.VERCEL_FRONTEND_PROJECT_ID || secrets.VERCEL_PROJECT_ID || vars.VERCEL_PROJECT_ID }}
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_FRONTEND_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::warning title=Missing Vercel config::${name} is not configured; skipping preview deploy"
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "ready=true" >> $GITHUB_OUTPUT
          else
            echo "ready=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node
        if: steps.vercel_secrets.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install frontend dependencies
        if: steps.vercel_secrets.outputs.ready == 'true'
        run: npm ci --legacy-peer-deps || npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build frontend
        if: steps.vercel_secrets.outputs.ready == 'true'
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || vars.VITE_API_BASE_URL || secrets.VITE_API_URL || 'https://pva-backend-api.vercel.app/api' }}
          VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME || vars.VITE_CLOUDINARY_CLOUD_NAME || '' }}
          VITE_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET || vars.VITE_CLOUDINARY_UPLOAD_PRESET || '' }}

      - name: Create .vercelignore
        if: steps.vercel_secrets.outputs.ready == 'true'
        run: |
          cat > .vercelignore <<EOF
          node_modules
          .env.local
          .env.*.local
          *.md
          .git
          EOF

      - name: Deploy Frontend Preview to Vercel
        if: steps.vercel_secrets.outputs.ready == 'true'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN || secrets.VERCEL_API_TOKEN }}
          working-directory: ./Frontend
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID || vars.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID || vars.VERCEL_FRONTEND_PROJECT_ID || secrets.VERCEL_PROJECT_ID || vars.VERCEL_PROJECT_ID }}

  post-deploy-readiness:
    name: Post-Deploy Readiness
    needs: deploy-pages
    runs-on: ubuntu-latest
    if: always() && ((github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref_to_deploy || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run strict live readiness gate
        env:
          FRONTEND_URL: https://pvabazaar.org
          BACKEND_URL: https://pva-backend-api.vercel.app
          STRICT: 'true'
          WAIT_TIMEOUT_MS: '300000'
          WAIT_POLL_MS: '10000'
        run: node scripts/verify-live-ready.mjs

      - name: Run live route sweep
        env:
          FRONTEND_URL: https://pvabazaar.org
          BACKEND_URL: https://pva-backend-api.vercel.app
        run: node scripts/verify-frontend-routes-live.mjs
