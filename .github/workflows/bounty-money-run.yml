name: Bounty Hunter - Money Run

on:
  schedule:
    # Every 10 minutes for higher opportunity capture
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Comma-separated platforms to scan (blank = all)'
        required: false
        default: ''
      minRewardRaw:
        description: 'Minimum numeric reward filter (e.g., 0)'
        required: false
        default: '0'
      limit:
        description: 'How many top opportunities to queue (1-25)'
        required: false
        default: '25'
      walletAddress:
        description: 'Override payout wallet address (optional)'
        required: false
        default: ''

jobs:
  money-run:
    name: Trigger /api/bounties/money-run
    runs-on: ubuntu-latest
    timeout-minutes: 6

    concurrency:
      group: bounty-money-run
      cancel-in-progress: false

    env:
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      API_AUTH_TOKEN: ${{ secrets.BOUNTY_SCAN_JWT }}
      DEFAULT_WALLET_ADDRESS: ${{ secrets.BOUNTY_PAYOUT_WALLET }}
      BOUNTY_SKILLS: ${{ secrets.BOUNTY_SKILLS }}

    steps:
      - name: Validate required secrets
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "Missing API_BASE_URL secret"
            exit 1
          fi
          if [ -z "$API_AUTH_TOKEN" ]; then
            echo "Missing BOUNTY_SCAN_JWT secret"
            exit 1
          fi

      - name: Build request payload
        id: payload
        run: |
          INPUT_LIMIT='${{ github.event.inputs.limit }}'
          INPUT_MIN='${{ github.event.inputs.minRewardRaw }}'
          INPUT_PLATFORMS='${{ github.event.inputs.platforms }}'
          INPUT_WALLET='${{ github.event.inputs.walletAddress }}'

          LIMIT=${INPUT_LIMIT:-25}
          MIN_REWARD=${INPUT_MIN:-0}
          PLATFORMS=${INPUT_PLATFORMS:-}
          WALLET_ADDRESS=${INPUT_WALLET:-$DEFAULT_WALLET_ADDRESS}

          if ! [[ "$LIMIT" =~ ^[0-9]+$ ]]; then LIMIT=25; fi
          if ! [[ "$MIN_REWARD" =~ ^[0-9]+$ ]]; then MIN_REWARD=0; fi

          if [ "$LIMIT" -lt 1 ]; then LIMIT=1; fi
          if [ "$LIMIT" -gt 25 ]; then LIMIT=25; fi

          if [ -n "$PLATFORMS" ]; then
            PAYLOAD=$(printf '{"limit":%s,"minRewardRaw":%s,"walletAddress":"%s","platforms":"%s"}' "$LIMIT" "$MIN_REWARD" "$WALLET_ADDRESS" "$PLATFORMS")
          else
            PAYLOAD=$(printf '{"limit":%s,"minRewardRaw":%s,"walletAddress":"%s"}' "$LIMIT" "$MIN_REWARD" "$WALLET_ADDRESS")
          fi

          echo "payload=$PAYLOAD" >> "$GITHUB_OUTPUT"

      - name: Execute money run
        run: |
          HTTP_STATUS=000
          for ATTEMPT in 1 2 3; do
            HTTP_STATUS=$(curl -s -o /tmp/money_run_response.json -w "%{http_code}" \
              -X POST "$API_BASE_URL/api/bounties/money-run" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $API_AUTH_TOKEN" \
              --data '${{ steps.payload.outputs.payload }}' \
              --max-time 120)

            if [ "$HTTP_STATUS" -eq 200 ]; then
              break
            fi

            echo "Attempt $ATTEMPT failed with HTTP $HTTP_STATUS"
            sleep $((ATTEMPT * 10))
          done

          echo "HTTP status: $HTTP_STATUS"
          cat /tmp/money_run_response.json || true

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Money run endpoint returned non-200: $HTTP_STATUS"
            exit 1
          fi

      - name: Validate response
        id: validate
        run: |
          node -e "
            const fs=require('fs');
            const p=JSON.parse(fs.readFileSync('/tmp/money_run_response.json','utf8'));
            if(!p.ok){console.error('money-run response !ok'); process.exit(1);}
            const ranked=p.rankedCount||0;
            const top=(p.top||[]).slice(0,3).map(b=>'• '+b.title+' (score='+b.score+')').join('\n');
            console.log('queued='+Boolean(p.queued)+' ranked='+ranked);
            require('fs').writeFileSync('/tmp/alert_summary.txt',
              'Money Run complete. Ranked: '+ranked+'\n'+(top||'(no top bounties)'));
          "

      - name: Send webhook alert
        env:
          WEBHOOK_URL: ${{ secrets.OPENCLAW_ALERT_WEBHOOK_URL }}
        if: env.WEBHOOK_URL != ''
        run: |
          SUMMARY=$(cat /tmp/alert_summary.txt 2>/dev/null || echo 'Money Run complete')
          PAYLOAD=$(node -e "process.stdout.write(JSON.stringify({
            text: '💸 *Bounty Money Run* — ' + process.env.SUMMARY,
            username: 'OpenClaw',
            icon_emoji: ':moneybag:'
          }))" SUMMARY="$SUMMARY")
          curl -s -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" --max-time 10 || true