name: Deploy Frontend to GitHub Pages (Legacy Manual)

on:
  workflow_dispatch:

# Canonical GitHub Pages deployment is handled by deploy-frontend.yml.
# This legacy workflow remains manual-only to avoid duplicate deployments
# that can publish inconsistent artifacts.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build
        run: |
          API_URL=$(node -pe "JSON.parse(require('fs').readFileSync('Frontend/public/api-base.json','utf8')).apiUrl || ''")
          if [ -z "$API_URL" ]; then
            echo "Frontend/public/api-base.json missing apiUrl"
            exit 1
          fi
          echo "Building frontend with VITE_API_URL=$API_URL"
          VITE_API_URL="$API_URL" npm run build --workspace Frontend

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'Frontend/dist'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Disabled: canonical Pages deploy is handled by deploy-frontend.yml
    if: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
