name: OpenClaw Uptime Monitor

on:
  schedule:
    # Every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openclaw-uptime-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      OPENCLAW_BACKEND_URL: ${{ secrets.OPENCLAW_BACKEND_URL }}
      OPENCLAW_ALERT_WEBHOOK_URL: ${{ secrets.OPENCLAW_ALERT_WEBHOOK_URL }}

    steps:
      - name: Validate required config
        run: |
          if [ -z "$OPENCLAW_BACKEND_URL" ]; then
            echo "OPENCLAW_BACKEND_URL secret is missing"
            exit 1
          fi

      - name: Check public health endpoints
        run: |
          curl -sS -f "$OPENCLAW_BACKEND_URL/api/health" > /tmp/health.json
          curl -sS -f "$OPENCLAW_BACKEND_URL/api/openclaw/status" > /tmp/openclaw-status.json

      - name: Validate OpenClaw status payload
        run: |
          node -e "const fs=require('fs'); const payload=JSON.parse(fs.readFileSync('/tmp/openclaw-status.json','utf8')); if(!payload.ok){console.error('OpenClaw status endpoint returned !ok'); process.exit(1);} if(!payload.configured){console.error('OpenClaw is not configured'); process.exit(1);} if(!payload.reachable){console.error('OpenClaw is configured but not reachable'); process.exit(1);} console.log('OpenClaw status healthy');"

      - name: Check queue health (admin auth)
        if: ${{ secrets.OPENCLAW_ADMIN_JWT != '' }}
        run: |
          curl -sS -f "$OPENCLAW_BACKEND_URL/api/openclaw/queue-stats" \
            -H "Authorization: Bearer ${{ secrets.OPENCLAW_ADMIN_JWT }}" > /tmp/openclaw-queue.json

      - name: Validate queue thresholds
        if: ${{ secrets.OPENCLAW_ADMIN_JWT != '' }}
        run: |
          node -e "const fs=require('fs'); const q=JSON.parse(fs.readFileSync('/tmp/openclaw-queue.json','utf8')); const pending=q.pendingOutbound||0; const stale=q.staleOutbound||0; const maxPending=40; const maxStale=5; if(pending>maxPending){console.error('OpenClaw pending queue too high: '+pending); process.exit(1);} if(stale>maxStale){console.error('OpenClaw stale queue too high: '+stale); process.exit(1);} console.log('OpenClaw queue healthy: pending='+pending+', stale='+stale);"

      - name: Queue health skipped notice
        if: ${{ secrets.OPENCLAW_ADMIN_JWT == '' }}
        run: echo "OPENCLAW_ADMIN_JWT not set; queue-auth checks skipped"

      - name: Notify on failure
        if: failure() && env.OPENCLAW_ALERT_WEBHOOK_URL != ''
        run: |
          PAYLOAD=$(printf '{"text":"OpenClaw uptime monitor failed for %s at %s. Run: %s/%s/actions/runs/%s"}' "$GITHUB_REPOSITORY" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          curl -sS -X POST "$OPENCLAW_ALERT_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            --max-time 15
