name: OpenClaw Uptime Monitor

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openclaw-uptime-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      OPENCLAW_FRONTEND_URL: ${{ secrets.OPENCLAW_FRONTEND_URL || vars.OPENCLAW_FRONTEND_URL || 'https://pvabazaar.org' }}
      OPENCLAW_BACKEND_URL: ${{ secrets.OPENCLAW_BACKEND_URL || vars.OPENCLAW_BACKEND_URL || 'https://pva-backend-api.vercel.app' }}
      OPENCLAW_ADMIN_JWT: ${{ secrets.OPENCLAW_ADMIN_JWT || secrets.BOUNTY_SCAN_JWT }}
      OPENCLAW_ALERT_WEBHOOK_URL: ${{ secrets.OPENCLAW_ALERT_WEBHOOK_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate required config
        run: |
          if [ -z "$OPENCLAW_BACKEND_URL" ]; then
            echo "OPENCLAW_BACKEND_URL secret is missing"
            exit 1
          fi

      - name: Run continuity readiness sweep
        env:
          FRONTEND_URL: ${{ env.OPENCLAW_FRONTEND_URL }}
          BACKEND_URL: ${{ env.OPENCLAW_BACKEND_URL }}
          STRICT: "true"
          WAIT_TIMEOUT_MS: "120000"
          WAIT_POLL_MS: "10000"
        run: |
          node scripts/verify-live-ready.mjs
          node scripts/verify-live-decentralized.mjs

      - name: Check public health endpoints
        run: |
          curl -sS -f "$OPENCLAW_FRONTEND_URL/" > /tmp/frontend-home.html
          curl -sS -f "$OPENCLAW_FRONTEND_URL/status.html" > /tmp/frontend-status.html
          curl -sS -f "$OPENCLAW_BACKEND_URL/api/health" > /tmp/health.json
          curl -sS -f "$OPENCLAW_BACKEND_URL/api/openclaw/status" > /tmp/openclaw-status.json

      - name: Validate OpenClaw status payload
        run: |
          node -e "
            const fs=require('fs');
            const payload=JSON.parse(fs.readFileSync('/tmp/openclaw-status.json','utf8'));
            if(!payload.ok){ console.error('OpenClaw status endpoint returned !ok'); process.exit(1); }
            if(!payload.configured){ console.warn('OpenClaw gateway not configured (queue-only mode) - continuing'); process.exit(0); }
            if(!payload.reachable){ console.warn('OpenClaw configured but gateway not reachable - continuing'); process.exit(0); }
            console.log('OpenClaw status healthy');
          "

      - name: Check queue health (admin auth)
        if: env.OPENCLAW_ADMIN_JWT != ''
        run: |
          curl -sS -f "$OPENCLAW_BACKEND_URL/api/openclaw/queue-stats" \
            -H "Authorization: Bearer $OPENCLAW_ADMIN_JWT" > /tmp/openclaw-queue.json

      - name: Validate queue thresholds
        if: env.OPENCLAW_ADMIN_JWT != ''
        run: |
          node -e "
            const fs=require('fs');
            const q=JSON.parse(fs.readFileSync('/tmp/openclaw-queue.json','utf8'));
            const pending=q.pendingOutbound||0;
            const stale=q.staleOutbound||0;
            const maxPending=40;
            const maxStale=5;
            if(pending>maxPending){ console.error('OpenClaw pending queue too high: '+pending); process.exit(1); }
            if(stale>maxStale){ console.error('OpenClaw stale queue too high: '+stale); process.exit(1); }
            console.log('OpenClaw queue healthy: pending='+pending+', stale='+stale);
          "

      - name: Replay stale outbound messages
        if: env.OPENCLAW_ADMIN_JWT != ''
        run: |
          RESULT=$(curl -sS -o /tmp/openclaw-replay.json -w "%{http_code}" \
            -X POST "$OPENCLAW_BACKEND_URL/api/openclaw/replay-webhook" \
            -H "Authorization: Bearer $OPENCLAW_ADMIN_JWT" \
            -H "Content-Type: application/json" \
            --data '{"limit":20}' \
            --max-time 30)
          echo "Replay HTTP status: $RESULT"
          cat /tmp/openclaw-replay.json || true
          # 400 = webhook not configured yet; that's fine
          if [ "$RESULT" != "200" ] && [ "$RESULT" != "400" ]; then
            echo "Replay call returned unexpected status $RESULT"
          fi

      - name: Queue health skipped notice
        if: env.OPENCLAW_ADMIN_JWT == ''
        run: echo "OPENCLAW_ADMIN_JWT not set; queue-auth checks skipped"

      - name: Notify on failure
        if: failure() && env.OPENCLAW_ALERT_WEBHOOK_URL != ''
        run: |
          PAYLOAD=$(printf '{"text":"[critical] PVA Bazaar continuity monitor failed for %s at %s. Run: %s/%s/actions/runs/%s"}' "$GITHUB_REPOSITORY" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          curl -sS -X POST "$OPENCLAW_ALERT_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            --max-time 15
