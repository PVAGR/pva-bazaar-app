<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PVABazaar Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Source+Code+Pro:wght@300;400&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: 'Inter', sans-serif;
        line-height: 1.8;
        color: #e1e8ed;
        background: linear-gradient(135deg, #0f1419 0%, #1a2332 50%, #0f1419 100%);
        max-width: 1000px;
        margin: 0 auto;
        padding: 2rem;
        min-height: 100vh;
      }
      h1 {
        font-size: 2.2rem;
        color: #fff;
        margin-bottom: 1rem;
      }
      .subtitle {
        font-family: 'Source Code Pro', monospace;
        color: #00d9ff;
      }
      .writings-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.5rem;
        margin: 2rem 0;
      }
      .card {
        background: rgba(26, 35, 50, 0.6);
        border: 1px solid rgba(0, 217, 255, 0.2);
        border-left: 3px solid #00d9ff;
        padding: 1.2rem;
        border-radius: 6px;
      }
      .card a {
        color: #00d9ff;
        text-decoration: none;
      }
      .note {
        color: #8ba3bf;
        font-size: 0.95rem;
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Portfolio</h1>
      <p class="subtitle">Live artifacts from the API</p>
    </header>
    <section id="list">
      <div class="note">Loading portfolio...</div>
    </section>
    <script type="module">
      import { getArtifacts } from '/js/api.js';
      const list = document.getElementById('list');
      async function render() {
        try {
          const items = await getArtifacts(0);
          if (!items || items.length === 0) {
            list.innerHTML = '<div class="note">No artifacts available yet.</div>';
            return;
          }
          const grid = document.createElement('div');
          grid.className = 'writings-grid';
          items.forEach((a) => {
            const card = document.createElement('div');
            card.className = 'card';
            const h3 = document.createElement('h3');
            h3.textContent = a.title || a.name || 'Artifact';
            const p = document.createElement('p');
            p.textContent = a.description || '';
            const link = document.createElement('a');
            const id = a._id || a.id || '';
            link.href = id ? `/pages/productshowcase.html?id=${encodeURIComponent(id)}` : '#';
            link.textContent = 'View Artifact';
            card.appendChild(h3);
            card.appendChild(p);
            card.appendChild(link);
            grid.appendChild(card);
          });
          list.innerHTML = '';
          list.appendChild(grid);
        } catch (e) {
          list.innerHTML = '<div class="note">API unavailable. Please check back soon.</div>';
        }
      }
      render();
    </script>
  </body>
</html>
