# Render free web service for the Express API (replaces paused Vercel backend).
# Set secrets in the Render dashboard (never commit real URIs/passwords).
# After deploy: attach custom domain api.pvabazaar.org per Render docs.
services:
  - type: web
    name: pva-bazaar-api
    env: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health-check
    envVars:
      - key: NODE_ENV
        value: production
      - key: ETHEREUM_RPC_URL
        value: https://mainnet.base.org
      - key: ALLOWED_ORIGIN
        value: https://pvabazaar.org,https://www.pvabazaar.org
      - key: PUBLIC_SITE_URL
        value: https://pvabazaar.org
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OPENCLAW_GATEWAY_URL
        sync: false
      - key: OPENCLAW_WEBHOOK_URL
        sync: false
      - key: OPENCLAW_API_KEY
        sync: false
      - key: OPENCLAW_BRIDGE_SECRET
        sync: false
      - key: OLLAMA_BASE_URL
        sync: false
      - key: OLLAMA_MODEL
        sync: false
      - key: OPENCLAW_BACKEND_URL
        sync: false
      - key: OPENCLAW_PUBLIC_MODE
        value: "true"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SECRET_CODE
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_URL
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: SOLANA_HOT_WALLET_PRIVATE_KEY
        sync: false
      - key: BOUNTY_PAYOUT_WALLET
        sync: false
      - key: BOUNTY_PAYOUT_CHAIN
        value: base
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_BOUNTY_REPOS
        sync: false
      - key: OPENCLAW_OLLAMA_BASE_URL
        sync: false
      - key: OPENCLAW_OLLAMA_MODEL
        sync: false
      - key: OPENCLAW_WEBSITE_HEALTH_URL
        sync: false
      - key: OPENCLAW_WEBSITE_URL
        sync: false
      - key: OPENCLAW_TELEGRAM_SOURCE
        sync: false
      - key: OPENCLAW_CHAT_TIMEOUT_MS
        sync: false
      - key: TELEGRAM_PUBLIC_MODE
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
