<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=/writings/">
    <title>PVA Bazaar - Writings Archive</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .container { max-width: 600px; padding: 40px; }
        h1 { font-size: 3em; color: #4ef8a3; margin-bottom: 20px; }
        p { font-size: 1.3em; color: #d1d5db; margin-bottom: 30px; }
        a {
            display: inline-block;
            padding: 15px 40px;
            background: linear-gradient(135deg, #1c5a45, #4ef8a3);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 1.2em;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1> PVA Bazaar</h1>
        <p>Redirecting to writings archive...</p>
        <p><a href="/writings/">Enter Writings Archive</a></p>
    </div>
    <script>window.location.href = '/writings/';</script>

</html>
